/* ============ Sort popup ============ */
$('#sort-btn')?.addEventListener('click', (e) => { e.stopPropagation(); showSortMenu(); });
function showSortMenu(){
  closeSortMenu();
  const btn = $('#sort-btn');
  const rect = btn.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.id = 'sort-menu';
  menu.className = 'sort-popup';
  [
    { key: 'updatedAt', label: 'По дате изменения' },
    { key: 'createdAt', label: 'По дате создания' },
    { key: 'title', label: 'По названию' }
  ].forEach(opt => {
    const b = document.createElement('button');
    if (settings.sortBy === opt.key) b.classList.add('active');
    b.innerHTML = `<span>${opt.label}</span><span class="check">✓</span>`;
    b.addEventListener('click', (ev) => {
      ev.stopPropagation();
      if (settings.sortBy === opt.key) settings.sortDir = settings.sortDir === 'asc' ? 'desc' : 'asc';
      else {
        settings.sortBy = opt.key;
        settings.sortDir = opt.key === 'title' ? 'asc' : 'desc';
      }
      saveSettings(); renderLibrary(); closeSortMenu();
    });
    menu.appendChild(b);
  });
  document.body.appendChild(menu);
  const mw = 210;
  let left = rect.right - mw; if (left < 12) left = 12;
  let top = rect.bottom + 6;
  const mh = menu.offsetHeight;
  if (top + mh > window.innerHeight - 12) top = rect.top - mh - 6;
  if (top < 12) top = 12;
  menu.style.left = left + 'px'; menu.style.top = top + 'px';
  setTimeout(() => document.addEventListener('click', closeSortMenu), 0);
}
function closeSortMenu(){
  const m = $('#sort-menu');
  if (m) m.remove();
  document.removeEventListener('click', closeSortMenu);
}

