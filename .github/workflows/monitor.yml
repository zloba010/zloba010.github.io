/* ============ Palette (Ctrl+K) ============ */
function openPalette(){
  $('#palette').classList.add('show');
  $('#palette-input').value = '';
  $('#palette-input').focus();
  renderPaletteItems('');
  paletteIndex = 0;
}
function closePalette(){
  $('#palette').classList.remove('show');
}
function renderPaletteItems(query){
  const list = $('#palette-list');
  if (!list) return;
  list.innerHTML = '';
  paletteItems = [];
  const q = query.trim().toLowerCase();

  const commands = [
    { id: 'new-text', icon: '📝', label: 'Новая заметка', hint: '⌘+Alt+N', run: () => createNote('text') },
    { id: 'new-checklist', icon: '☑', label: 'Новый чек-лист', hint: '', run: () => createNote('checklist') },
    { id: 'today', icon: '📔', label: 'Дневник за сегодня', hint: '', run: openDaily },
    { id: 'templates', icon: '📋', label: 'Из шаблона…', hint: '', run: openTemplates },
    { id: 'settings', icon: '⚙', label: 'Настройки', hint: '', run: openSettings },
    { id: 'tags', icon: '#', label: 'Теги', hint: '', run: openTagsSheet },
    { id: 'export', icon: '⬇', label: 'Экспорт библиотеки', hint: '', run: exportLibrary },
    { id: 'import', icon: '⬆', label: 'Импорт библиотеки', hint: '', run: () => $('#import-input').click() },
    { id: 'theme', icon: '🎨', label: 'Сменить тему', hint: '', run: toggleTheme }
  ];
  commands.forEach(c => {
    if (q && !c.label.toLowerCase().includes(q)) return;
    paletteItems.push({ type: 'cmd', ...c });
  });
  notes.filter(n => !n.deletedAt).forEach(n => {
    const title = getNoteTitle(n);
    if (q && !title.toLowerCase().includes(q)) return;
    paletteItems.push({ type: 'note', id: n.id, icon: '📄', label: title, hint: formatDate(n.updatedAt) });
  });
  if (!paletteItems.length){
    list.innerHTML = '<div class="palette-empty">Ничего не найдено</div>';
    return;
  }
  paletteItems.slice(0, 50).forEach((item, idx) => {
    const btn = document.createElement('button');
    btn.className = 'palette-item' + (idx === 0 ? ' active' : '');
    btn.innerHTML = `<span class="pi-icon">${esc(item.icon)}</span><span class="pi-label">${esc(item.label)}</span><span class="pi-hint">${esc(item.hint || '')}</span>`;
    btn.addEventListener('click', () => runPaletteItem(item));
    list.appendChild(btn);
  });
}
function runPaletteItem(item){
  closePalette();
  if (item.type === 'cmd' && item.run) item.run();
  else if (item.type === 'note') openEditor(item.id);
}
$('#palette-input')?.addEventListener('input', (e) => {
  renderPaletteItems(e.target.value);
  paletteIndex = 0;
});
$('#palette-input')?.addEventListener('keydown', (e) => {
  const items = $$('#palette-list .palette-item');
  if (e.key === 'ArrowDown'){
    e.preventDefault();
    paletteIndex = Math.min(paletteIndex + 1, items.length - 1);
    updatePaletteActive(items);
  } else if (e.key === 'ArrowUp'){
    e.preventDefault();
    paletteIndex = Math.max(paletteIndex - 1, 0);
    updatePaletteActive(items);
  } else if (e.key === 'Enter'){
    e.preventDefault();
    if (paletteItems[paletteIndex]) runPaletteItem(paletteItems[paletteIndex]);
  } else if (e.key === 'Escape'){
    closePalette();
  }
});
function updatePaletteActive(items){
  items.forEach((el, i) => el.classList.toggle('active', i === paletteIndex));
  if (items[paletteIndex]) items[paletteIndex].scrollIntoView({ block: 'nearest' });
}
