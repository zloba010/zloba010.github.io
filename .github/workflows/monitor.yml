/* ============ Move modal ============ */
function openMoveModal(ids){
  moveIds = ids || [];
  const list = $('#move-list');
  if (!list) return;
  list.innerHTML = '';
  const addOpt = (label, folderId) => {
    const btn = document.createElement('button');
    btn.className = 'sheet-action';
    btn.style.padding = '10px 12px';
    btn.innerHTML = `<span class="icon">${folderId === null ? '◯' : '📁'}</span><span>${esc(label)}</span>`;
    btn.addEventListener('click', () => {
      const now = Date.now();
      moveIds.forEach(id => {
        const n = notes.find(x => x.id === id);
        if (n){ n.folderId = folderId; n.updatedAt = now; }
      });
      saveNotes();
      if ($('#view-editor').classList.contains('active')) editorState.folderId = folderId;
      closeMoveModal(); exitSelectionMode();
      toast('Перемещено');
    });
    list.appendChild(btn);
  };
  addOpt('Без папки', null);
  folders.forEach(f => addOpt(f.name, f.id));
  const newBtn = document.createElement('button');
  newBtn.className = 'sheet-action';
  newBtn.style.padding = '10px 12px';
  newBtn.innerHTML = `<span class="icon">＋</span><span>Новая папка</span>`;
  newBtn.addEventListener('click', () => { closeMoveModal(); setTimeout(() => openFolderModal('create'), 200); });
  list.appendChild(newBtn);
  $('#move-modal').classList.add('show');
}
