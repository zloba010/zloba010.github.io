/* ============ Checklist toggle ============ */
$('#tb-checklist')?.addEventListener('click', () => {
  const note = notes.find(n => n.id === currentNoteId);
  if (!note) return;
  const hasMedia = note.type !== 'checklist' && /<img|voice-note/.test($('#editor-content').innerHTML);
  if (hasMedia && note.type !== 'checklist'){
    showConfirm('Картинки и голос будут потеряны', 'При преобразовании в список изображения и аудио будут удалены. Продолжить?', () => convertToChecklist(note));
    return;
  }
  if (note.type === 'checklist'){
    const items = collectChecklistItems();
    const html = items.map(it => `<p>${it.done ? '☑ ' : '☐ '}${esc(it.text)}</p>`).join('');
    note.type = 'text';
    note.html = html;
    note.items = [];
    editorState.type = 'text';
    $('#editor-content').innerHTML = html;
    showTextEditor();
    $('#tb-checklist').classList.remove('active');
    $('#format-bar').querySelectorAll('button[data-cmd="insertUnorderedList"], button[data-cmd="insertOrderedList"]').forEach(b => { b.style.display = ''; });
    saveNoteNow();
  } else {
    convertToChecklist(note);
  }
});
function convertToChecklist(note){
  const content = $('#editor-content');
  const blockEls = content.querySelectorAll('p, div, li, h1, h2, h3, h4, h5, h6, blockquote');
  let texts;
  if (blockEls.length > 1){
    texts = Array.from(blockEls).map(el => el.textContent.trim()).filter(Boolean);
  } else {
    const raw = (content.textContent || '').trim();
    texts = raw ? raw.split(/\n+/).map(t => t.trim()).filter(Boolean) : [];
  }
  if (!texts.length) texts = [''];
  const items = texts.map(t => {
    const done = /^[☑✓✔]\s*/.test(t);
    const clean = t.replace(/^[☑✓✔☐□]\s*/, '').replace(/^[-•*]\s+/, '').replace(/^\d+\.\s+/, '');
    return { id: uid(), text: clean, done };
  });
  note.type = 'checklist';
  note.items = items;
  note.html = '';
  editorState.type = 'checklist';
  showChecklistEditor(items);
  $('#tb-checklist').classList.add('active');
  $('#format-bar').querySelectorAll('button[data-cmd="insertUnorderedList"], button[data-cmd="insertOrderedList"]').forEach(b => { b.style.display = 'none'; });
  saveNoteNow();
}

/* ============ Selection for insert ============ */
function saveSelection(){
  const sel = window.getSelection();
  if (sel.rangeCount && $('#editor-content').contains(sel.anchorNode)){
    savedSelection = sel.getRangeAt(0).cloneRange();
  } else {
    savedSelection = null;
  }
}
function restoreSelection(){
  if (!savedSelection) return false;
  try {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(savedSelection);
    return true;
  } catch(e){ return false; }
}

/* ============ Image insert ============ */
async function insertImageFile(file){
  const note = notes.find(n => n.id === currentNoteId);
  if (!note || note.type === 'checklist') return;
  const attId = uid();
  try { await idbPut('att:' + attId, file); }
  catch(err){ toast('Не удалось сохранить'); return; }
  const url = trackBlobUrl(URL.createObjectURL(file));
  const wrap = document.createElement('span');
  wrap.className = 'img-wrap';
  wrap.contentEditable = 'false';
  wrap.dataset.attId = attId;
  const img = document.createElement('img');
  img.dataset.attId = attId;
  img.src = url;
  const del = document.createElement('button');
  del.className = 'img-del';
  del.type = 'button';
  del.textContent = '✕';
  wrap.appendChild(img); wrap.appendChild(del);
  wrap.dataset.bound = '1';
  setupImageWidget(wrap);
  const content = $('#editor-content');
  content.focus();
  if (!restoreSelection()){
    content.appendChild(wrap);
    content.appendChild(document.createElement('br'));
  } else {
    const sel = window.getSelection();
    const range = sel.getRangeAt(0);
    range.deleteContents();
    range.insertNode(wrap);
    const br = document.createElement('br');
    wrap.after(br);
    const r2 = document.createRange();
    r2.setStartAfter(br);
    r2.collapse(true);
    sel.removeAllRanges();
    sel.addRange(r2);
  }
  markEditorDirty();
  updateEditorEmptyState();
}
