  const body = $('#settings-body');
  if (!body) return;
  const totalNotes = notes.filter(n => !n.deletedAt).length;
  const totalWords = notes.filter(n => !n.deletedAt).reduce((s, n) => {
    const text = n.type === 'checklist' ? (n.items || []).map(i => i.text).join(' ') : stripHtml(n.html || '');
    return s + (text.trim() ? text.trim().split(/\s+/).length : 0);
  }, 0);
  const totalTags = new Set(notes.filter(n => !n.deletedAt).flatMap(n => n.tags || [])).size;
  const days = new Set(notes.filter(n => !n.deletedAt).map(n => new Date(n.createdAt).toISOString().slice(0, 10))).size;

  body.innerHTML = `
    <div class="settings-group">
      <h4>Внешний вид</h4>
      <div class="settings-row">
