function openActionsSheet(){
  const body = $('#actions-sheet-body');
  if (!body) return;
  const note = notes.find(n => n.id === currentNoteId);
  if (!note) return;
  const displayTitle = getNoteTitle(note);

  if (note.deletedAt){
