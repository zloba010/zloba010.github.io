  document.documentElement.setAttribute('data-theme', settings.theme);
  const icon = $('#btn-theme');
  if (icon) icon.textContent = THEME_ICONS[settings.theme] || '☾';
  saveSettings();
}
function toggleTheme(){
  const i = THEME_CYCLE.indexOf(settings.theme);
  settings.theme = THEME_CYCLE[(i + 1) % THEME_CYCLE.length];
  applyTheme();
}

/* ============ Helpers ============ */
function localDateKey(d){
  d = d || new Date();
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
}
function stripHtml(html){
  if (!html) return '';
  const d = document.createElement('div');
  d.innerHTML = html;
  d.querySelectorAll('.voice-note').forEach(el => el.remove());
  return (d.textContent || '').replace(/\s+/g, ' ').trim();
}
function getFirstLine(note){
  if (note.type === 'checklist'){
    const first = (note.items || []).find(i => i.text && i.text.trim());
    return first ? first.text : '';
  }
  const text = stripHtml(note.html || '');
  return text.split(/[.!?…]\s|\n/)[0] || text;
}
function getNoteTitle(note){
  if (note.title && note.title.trim()) return note.title.trim();
  const first = getFirstLine(note);
  if (first) return first.slice(0, 80);
  return note.type === 'checklist' ? 'Список' : 'Без названия';
}
function formatDate(ts){
  if (!ts) return '';
  const d = new Date(ts);
  const now = new Date();
  const diff = now - d;
  if (diff < 60000) return 'только что';
  if (diff < 3600000) return Math.floor(diff / 60000) + ' мин';
  if (diff < 86400000 && d.getDate() === now.getDate()){
    return d.toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
  }
  if (diff < 86400000 * 7){
    return d.toLocaleDateString('ru-RU', { weekday: 'short', hour: '2-digit', minute: '2-digit' });
  }
  return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
}
function formatDuration(sec){
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  return m + ':' + String(s).padStart(2, '0');
}
function pluralNotes(n){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'заметка';
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'заметки';
  return 'заметок';
}
function pluralWords(n){
  const m10 = n % 10, m100 = n % 100;
  if (m10 === 1 && m100 !== 11) return 'слово';
  if (m10 >= 2 && m10 <= 4 && (m100 < 10 || m100 >= 20)) return 'слова';
  return 'слов';
}
function vibrate(ms = 10){
  try { if (navigator.vibrate) navigator.vibrate(ms); } catch(e){}
}

/* ============ Extract tags and links ============ */
function extractTags(note){
  const text = note.type === 'checklist'
    ? (note.items || []).map(i => i.text).join(' ')
    : stripHtml(note.html || '');
  const re = /(?:^|\s)#([а-яёa-z0-9_-]+)/gi;
  const tags = new Set();
  let m;
  while ((m = re.exec(text))){ tags.add(m[1].toLowerCase()); }
  return Array.from(tags);
}
function extractLinks(note){
  const text = note.type === 'checklist'
    ? (note.items || []).map(i => i.text).join(' ')
    : (note.html || '');
  const re = /\[\[([^\]]+)\]\]/g;
  const set = new Set();
  let m;
  while ((m = re.exec(text))){ set.add(m[1].trim()); }
  return Array.from(set);
}

/* ============ Sanitize paste ============ */
const ALLOWED_TAGS = new Set(['B','STRONG','I','EM','U','S','STRIKE','BR','P','DIV','SPAN',
  'UL','OL','LI','A','H1','H2','H3','H4','H5','H6','BLOCKQUOTE','CODE','PRE','HR']);
function sanitizePastedHtml(html){
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const walk = (node) => {
    if (node.nodeType === 1){
      const tag = node.tagName;
      if (!ALLOWED_TAGS.has(tag)){
        const parent = node.parentNode;
        while (node.firstChild) parent.insertBefore(node.firstChild, node);
        parent.removeChild(node);
        return;
      }
      const keepHref = (tag === 'A');
      for (const attr of Array.from(node.attributes)){
        const name = attr.name.toLowerCase();
        if (keepHref && name === 'href') continue;
        node.removeAttribute(attr.name);
      }
      if (keepHref){
        node.setAttribute('target', '_blank');
        node.setAttribute('rel', 'noopener noreferrer');
      }
    }
    for (const child of Array.from(node.childNodes)) walk(child);
  };
  walk(tpl.content);
  return tpl.innerHTML;
}

/* ============ Linkify URLs in saved HTML ============ */
function linkifyHtml(html){
  if (!html) return html;
  const tpl = document.createElement('template');
  tpl.innerHTML = html;
  const walker = document.createTreeWalker(tpl.content, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const urlRe = /(https?:\/\/[^\s<>"']+)/g;
  for (const node of nodes){
    if (node.parentElement?.closest('a, code, pre, .voice-note, .wikilink, .hashtag')) continue;
    const text = node.nodeValue || '';
    if (!urlRe.test(text)) continue;
    urlRe.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0;
    let m;
    while ((m = urlRe.exec(text))){
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      const a = document.createElement('a');
      a.href = m[1];
      a.target = '_blank';
      a.rel = 'noopener noreferrer';
      a.textContent = m[1];
      frag.appendChild(a);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
  return tpl.innerHTML;
}

/* ============ Sorting / Filtering ============ */
const SORT_LABELS = { updatedAt: 'Дата', createdAt: 'Создано', title: 'Название' };
function sortNotes(list){
  const by = settings.sortBy || 'updatedAt';
  const dir = settings.sortDir === 'asc' ? 1 : -1;
  const collator = new Intl.Collator('ru', { numeric: true, sensitivity: 'base' });
  const pinnedFirst = (a, b) => (b.pinned ? 1 : 0) - (a.pinned ? 1 : 0);
  return list.slice().sort((a, b) => {
    const p = pinnedFirst(a, b);
    if (p !== 0) return p;
    let cmp = 0;
    if (by === 'title') cmp = collator.compare(getNoteTitle(a), getNoteTitle(b));
    else if (by === 'createdAt') cmp = (a.createdAt || 0) - (b.createdAt || 0);
    else cmp = (a.updatedAt || 0) - (b.updatedAt || 0);
    return cmp * dir;
  });
}
function getVisibleNotes(){
  let list = notes.filter(n => {
    if (settings.filterFolder === 'trash') return !!n.deletedAt;
    if (n.deletedAt) return false;
    return true;
  });
  if (settings.filterFolder !== 'all' && settings.filterFolder !== 'trash'){
    list = list.filter(n => n.folderId === settings.filterFolder);
  }
  if (settings.filterFolder !== 'trash'){
    if (settings.filterType === 'text') list = list.filter(n => n.type !== 'checklist');
    else if (settings.filterType === 'checklist') list = list.filter(n => n.type === 'checklist');
  }
  if (settings.filterTag){
    list = list.filter(n => (n.tags || []).includes(settings.filterTag));
  }
  const q = ($('#search-input')?.value || '').trim().toLowerCase();
  if (q){
    list = list.filter(n => {
      if ((n.title || '').toLowerCase().includes(q)) return true;
      if (stripHtml(n.html || '').toLowerCase().includes(q)) return true;
      if ((n.items || []).some(it => (it.text || '').toLowerCase().includes(q))) return true;
      if ((n.tags || []).some(t => t.includes(q))) return true;
      return false;
    });
  }
  return sortNotes(list);
}

/* ============ Header subtitle ============ */
function updateSubtitle(){
  const sub = $('#lib-subtitle');
  if (!sub) return;
  const activeCount = notes.filter(n => !n.deletedAt).length;
  if (settings.filterFolder === 'trash') sub.textContent = 'Корзина';
  else if (settings.filterTag) sub.textContent = `#${settings.filterTag}`;
  else if (activeCount === 0) sub.textContent = 'Kizamia Notes';
  else sub.textContent = `${activeCount} ${pluralNotes(activeCount)}`;
}

/* ============ Chips ============ */
function renderChips(){
  const scroll = $('#chips-scroll');
  if (!scroll) return;
  scroll.innerHTML = '';
  const counts = {
    all: notes.filter(n => !n.deletedAt).length,
    text: notes.filter(n => !n.deletedAt && n.type !== 'checklist').length,
    checklist: notes.filter(n => !n.deletedAt && n.type === 'checklist').length
  };
  const trashCount = notes.filter(n => n.deletedAt).length;
  const allTags = new Set();
  notes.filter(n => !n.deletedAt).forEach(n => (n.tags || []).forEach(t => allTags.add(t)));

  const addChip = (label, active, count, onClick, extra = '') => {
    const btn = document.createElement('button');
    btn.className = 'chip' + (active ? ' active' : '') + (extra ? ' ' + extra : '');
    btn.innerHTML = label + (count !== undefined ? ` <span class="count">${count}</span>` : '');
    btn.addEventListener('click', (e) => {
      if (Date.now() < _chipSuppressUntil) { _chipSuppressUntil = 0; return; }
      onClick(e);
    });
    scroll.appendChild(btn);
    return btn;
  };

  addChip('Все', settings.filterFolder === 'all' && settings.filterType === 'all' && !settings.filterTag, counts.all, () => {
    settings.filterFolder = 'all'; settings.filterType = 'all'; settings.filterTag = null; saveSettings(); renderLibrary();
  });
  addChip('Заметки', settings.filterFolder === 'all' && settings.filterType === 'text' && !settings.filterTag, counts.text, () => {
    settings.filterFolder = 'all'; settings.filterType = 'text'; settings.filterTag = null; saveSettings(); renderLibrary();
  });
  addChip('Списки', settings.filterFolder === 'all' && settings.filterType === 'checklist' && !settings.filterTag, counts.checklist, () => {
    settings.filterFolder = 'all'; settings.filterType = 'checklist'; settings.filterTag = null; saveSettings(); renderLibrary();
  });

  folders.forEach(f => {
    const count = notes.filter(n => !n.deletedAt && n.folderId === f.id).length;
    const btn = addChip(esc(f.name), settings.filterFolder === f.id, count, () => {
      settings.filterFolder = f.id; settings.filterType = 'all'; settings.filterTag = null; saveSettings(); renderLibrary();
    });
    btn.addEventListener('contextmenu', (e) => { e.preventDefault(); openFolderModal('edit', f.id); });
    let t = null;
    btn.addEventListener('pointerdown', (e) => {
      if (e.button !== 0) return;
      t = setTimeout(() => {
        t = null;
        vibrate(15);
        _chipSuppressUntil = Date.now() + 400;
        openFolderModal('edit', f.id);
      }, 550);
    });
    const cancel = () => { if (t){ clearTimeout(t); t = null; } };
    btn.addEventListener('pointerup', cancel);
    btn.addEventListener('pointerleave', cancel);
    btn.addEventListener('pointercancel', cancel);
    btn.addEventListener('pointermove', cancel);
  });

  if (allTags.size){
    addChip(`<span class="dot"></span>Теги ${allTags.size}`, !!settings.filterTag, undefined, () => {
      openTagsSheet();
    }, 'tags-chip');
  }

  if (trashCount > 0){
    addChip('🗑 Корзина', settings.filterFolder === 'trash', trashCount, () => {
      settings.filterFolder = 'trash'; settings.filterType = 'all'; settings.filterTag = null; saveSettings(); renderLibrary();
    });
  }
  addChip('＋ Папка', false, undefined, () => openFolderModal('create'), 'add');
}

function renderSortLabel(){
  const lbl = $('#sort-label');
  const arr = $('#sort-arrow');
  if (lbl) lbl.textContent = SORT_LABELS[settings.sortBy] || 'Дата';
  if (arr) arr.textContent = settings.sortDir === 'asc' ? '↑' : '↓';
}

/* ============ Note card ============ */
function getNotePreviewHtml(note){
  if (note.type === 'checklist'){
    const items = (note.items || []).slice(0, 4);
    if (!items.length) return '<span style="color:var(--text-dim);opacity:.7;">Пустой список</span>';
    return items.map(it =>
      `<div class="note-check-item ${it.done ? 'done' : ''}"><span class="box"></span><span>${esc(it.text || '')}</span></div>`
    ).join('');
  }
  const text = stripHtml(note.html || '');
  if (!text && !/<img|voice-note/.test(note.html || '')) return '<span style="color:var(--text-dim);opacity:.7;">Пустая заметка</span>';
  if (!text && /<img/.test(note.html || '')) return '<span style="color:var(--text-dim);opacity:.7;">📷 Изображение</span>';
  if (!text && /voice-note/.test(note.html || '')) return '<span style="color:var(--text-dim);opacity:.7;">🎙 Голосовая заметка</span>';
  const firstLine = getFirstLine(note);
  if (!note.title && firstLine && text.startsWith(firstLine)){
    const rest = text.slice(firstLine.length).trim();
    if (!rest) return '<span style="color:var(--text-dim);opacity:.7;">…</span>';
    return esc(rest);
  }
  return esc(text);
}
function getNoteBadges(note){
  const badges = [];
  if (note.type === 'checklist') badges.push('<span class="badge checklist">Список</span>');
  if (note.isDaily) badges.push('<span class="badge daily">Дневник</span>');
  if (note.html){
    if (/<img[^>]*data-att-id/.test(note.html)) badges.push('<span class="badge image">🖼 Фото</span>');
    if (/class="voice-note"/.test(note.html)) badges.push('<span class="badge voice">🎙 Голос</span>');
  }
  const folder = note.folderId ? folders.find(f => f.id === note.folderId) : null;
  if (folder) badges.push(`<span class="folder-tag">📁 ${esc(folder.name)}</span>`);
  return badges.join('');
}
function getChecklistProgressHtml(note){
  if (note.type !== 'checklist') return '';
  const items = note.items || [];
  if (!items.length) return '';
  const total = items.length;
  const done = items.filter(i => i.done).length;
  const pct = Math.round((done / total) * 100);
  return `<div class="note-progress"><span class="np-bar"><span class="np-fill" style="width:${pct}%"></span></span><span class="np-text">${done}/${total}</span></div>`;
}

function renderNoteCard(note){
  const div = document.createElement('div');
  div.className = 'note';
  div.dataset.id = note.id;
  div.dataset.color = note.color || 'none';
  if (selectedIds.has(note.id)) div.classList.add('selected');

  const title = getNoteTitle(note);
  const tagsHtml = (note.tags || []).slice(0, 3).map(t => `<span class="note-tag">#${esc(t)}</span>`).join('');

  div.innerHTML = `
    <div class="select-indicator"></div>
    <button class="note-pin ${note.pinned ? 'pinned' : ''}" type="button" title="${note.pinned ? 'Открепить' : 'Закрепить'}">📌</button>
    <div class="note-title">${esc(title)}</div>
    <div class="note-preview">${getNotePreviewHtml(note)}</div>
    ${tagsHtml ? `<div class="note-tags">${tagsHtml}</div>` : ''}
    ${getChecklistProgressHtml(note)}
    <div class="note-meta">
      <span>${formatDate(note.updatedAt || note.createdAt)}</span>
      ${getNoteBadges(note)}
    </div>
  `;

  const pinBtn = div.querySelector('.note-pin');
  if (pinBtn){
    pinBtn.addEventListener('click', (e) => {
      e.stopPropagation();
      e.preventDefault();
      const n = notes.find(x => x.id === note.id);
      if (!n) return;
      n.pinned = !n.pinned;
      n.updatedAt = Date.now();
      saveNotes();
      vibrate(10);
      renderLibrary();
      toast(n.pinned ? 'Закреплено' : 'Откреплено');
    });
    pinBtn.addEventListener('pointerdown', (e) => e.stopPropagation());
  }

  div.addEventListener('click', () => {
    if (suppressNextClick){ suppressNextClick = false; return; }
    if (document.body.classList.contains('selection-mode')) toggleSelection(note.id);
    else openEditor(note.id);
  });

  let pressTimer = null;
  div.addEventListener('pointerdown', (e) => {
    if (e.button !== 0) return;
    if (document.body.classList.contains('selection-mode')) return;
    if (e.target.closest('.note-pin')) return;
    pressTimer = setTimeout(() => {
      pressTimer = null;
      suppressNextClick = true;
      vibrate(15);
      enterSelectionMode(note.id);
    }, 550);
  });
  const clearPress = () => { if (pressTimer){ clearTimeout(pressTimer); pressTimer = null; } };
  div.addEventListener('pointerup', clearPress);
  div.addEventListener('pointercancel', clearPress);
  div.addEventListener('pointerleave', clearPress);
  div.addEventListener('pointermove', clearPress);
  div.addEventListener('contextmenu', (e) => {
    e.preventDefault();
    if (!document.body.classList.contains('selection-mode')) enterSelectionMode(note.id);
  });

  return div;
}

function renderLibrary(){
  renderChips();
  renderSortLabel();
  updateSubtitle();
  const grid = $('#notes-grid');
  const empty = $('#lib-empty');
  if (!grid || !empty) return;
  grid.innerHTML = '';
  grid.className = 'notes-grid' + (settings.view === 'list' ? ' list' : '');

  const visible = getVisibleNotes();
  if (!visible.length){
    grid.hidden = true; empty.hidden = false;
    if (settings.filterFolder === 'trash'){
      empty.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><path d="M3 6h18"/><path d="M8 6V4a1 1 0 0 1 1-1h6a1 1 0 0 1 1 1v2"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/></svg><h2>Корзина пуста</h2><p>Удалённые заметки появятся здесь и будут храниться 30 дней</p>`;
    } else if (notes.filter(n => !n.deletedAt).length === 0){
      empty.innerHTML = `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" width="48" height="48"><rect x="3" y="3" width="18" height="18" rx="2"/><line x1="7" y1="9" x2="17" y2="9"/><line x1="7" y1="13" x2="17" y2="13"/><line x1="7" y1="17" x2="13" y2="17"/></svg><h2>Нет заметок</h2><p>Создайте первую — текст, список, шаблон или дневник</p><button class="btn-primary" id="empty-create">＋ Создать заметку</button>`;
      const btn = $('#empty-create');
      if (btn) btn.addEventListener('click', () => showAddMenu());
    } else {
      empty.innerHTML = `<h2>Здесь пока пусто</h2><p>Нет заметок по выбранному фильтру.</p>`;
    }
    return;
  }
  grid.hidden = false; empty.hidden = true;
  visible.forEach(n => grid.appendChild(renderNoteCard(n)));
}

/* ============ Selection mode ============ */
function enterSelectionMode(id){
  if (id) selectedIds.add(id);
  document.body.classList.add('selection-mode');
  updateSelectionHeader();
  renderLibrary();
}
function exitSelectionMode(){
  selectedIds.clear();
  document.body.classList.remove('selection-mode');
  updateSelectionHeader();
  renderLibrary();
}
function toggleSelection(id){
  if (selectedIds.has(id)) selectedIds.delete(id);
  else selectedIds.add(id);
  if (!selectedIds.size){ exitSelectionMode(); return; }
  updateSelectionHeader();
  renderLibrary();
}
function updateSelectionHeader(){
  const brand = $('#lib-brand');
  if (brand) brand.setAttribute('data-selected-count', selectedIds.size);
  const inTrash = settings.filterFolder === 'trash';
  const selPin = $('#sel-pin'), selColor = $('#sel-color'), selMove = $('#sel-move');
  const selRestore = $('#sel-restore'), selDelete = $('#sel-delete');
  if (selPin) selPin.hidden = inTrash;
  if (selColor) selColor.hidden = inTrash;
  if (selMove) selMove.hidden = inTrash;
  if (selRestore) selRestore.hidden = !inTrash;
  if (selDelete) selDelete.innerHTML = inTrash
    ? '<span class="icon">✕</span>Навсегда'
    : '<span class="icon">✕</span>Удалить';
}

$('#sel-select-all')?.addEventListener('click', () => {
  const visible = getVisibleNotes();
  const allSelected = visible.every(n => selectedIds.has(n.id));
  if (allSelected){
    visible.forEach(n => selectedIds.delete(n.id));
    if (!selectedIds.size){ exitSelectionMode(); return; }
  } else {
    visible.forEach(n => selectedIds.add(n.id));
  }
  updateSelectionHeader();
  renderLibrary();
});
$('#sel-pin')?.addEventListener('click', () => {
  const anyPinned = Array.from(selectedIds).some(id => notes.find(n => n.id === id)?.pinned);
  const now = Date.now();
  selectedIds.forEach(id => {
    const n = notes.find(x => x.id === id);
    if (n){ n.pinned = !anyPinned; n.updatedAt = now; }
  });
  saveNotes(); exitSelectionMode();
  toast(anyPinned ? 'Откреплено' : 'Закреплено');
});
$('#sel-color')?.addEventListener('click', () => openColorSheet());
$('#sel-move')?.addEventListener('click', () => openMoveModal(Array.from(selectedIds)));
$('#sel-restore')?.addEventListener('click', () => {
  const ids = Array.from(selectedIds);
  const now = Date.now();
  ids.forEach(id => {
    const n = notes.find(x => x.id === id);
    if (n){ n.deletedAt = null; n.updatedAt = now; }
  });
  saveNotes(); exitSelectionMode();
  toast(`Восстановлено: ${ids.length}`);
});
$('#sel-delete')?.addEventListener('click', () => {
  const n = selectedIds.size;
  const inTrash = settings.filterFolder === 'trash';
  if (inTrash){
    showConfirm('Удалить навсегда?', `Будет стёрто ${n} ${pluralNotes(n)}. Действие нельзя отменить.`, () => {
      selectedIds.forEach(id => {
        const note = notes.find(x => x.id === id);
        if (note && note.html){
          const matches = note.html.matchAll(/data-att-id="([^"]+)"/g);
          for (const m of matches) idbDel('att:' + m[1]).catch(() => {});
        }
      });
      notes = notes.filter(x => !selectedIds.has(x.id));
      saveNotes(); exitSelectionMode();
      toast('Удалено навсегда');
    });
  } else {
    showConfirm('Переместить в корзину?', `Будет удалено ${n} ${pluralNotes(n)}. Восстановить можно в течение 30 дней.`, () => {
      const now = Date.now();
      const movedIds = Array.from(selectedIds);
      movedIds.forEach(id => {
        const note = notes.find(x => x.id === id);
        if (note){ note.deletedAt = now; note.updatedAt = now; }
      });
      saveNotes(); exitSelectionMode();
      toast(`В корзине: ${movedIds.length}`, {
        actionLabel: 'Отменить',
        action: () => {
          movedIds.forEach(id => {
            const note = notes.find(x => x.id === id);
            if (note){ note.deletedAt = null; note.updatedAt = Date.now(); }
          });
          saveNotes(); renderLibrary();
        },
        duration: 5000
      });
    });
  }
});

/* ============ Editor ============ */
let editorState = { id: null, type: 'text', color: 'none', pinned: false, folderId: null };

function applyEditorWidth(){
  const map = { narrow: '640px', normal: '820px', wide: '1000px' };
  document.documentElement.style.setProperty('--editor-w', map[settings.editorWidth] || '820px');
}
function applyEditorFont(){
  const map = {
    system: '-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif',
    serif: 'Georgia,"Iowan Old Style","PT Serif",serif',
    mono: 'ui-monospace,"SF Mono",Menlo,Consolas,monospace'
  };
  const c = $('#editor-content');
  if (c) c.style.fontFamily = map[settings.fontStyle] || map.system;
}
function applyFontSizeToContent(){
  const fs = settings.fontSize || 16;
  const content = $('#editor-content');
  if (content) content.style.fontSize = fs + 'px';
  const wrap = $('#checklist-wrap');
  if (wrap) wrap.style.setProperty('--content-fs', fs + 'px');
  const hint = $('#fs-hint');
  if (hint) hint.textContent = fs;
}

function openEditor(id){
  const note = notes.find(n => n.id === id);
  if (!note) return;
  revokeEditorBlobUrls();
  currentNoteId = note.id;
  editorState = {
    id: note.id,
    type: note.type || 'text',
    color: note.color || 'none',
    pinned: !!note.pinned,
    folderId: note.folderId || null
  };
  recorder = null;
  updateVoiceBtn();
  hideRecordingBar();

  $('#editor-title').value = note.title || '';
  $('#editor-content').innerHTML = note.html || '';

  resolveAttachmentsInEditor();
  setupLinksInEditor();
  setupTagsInEditor();

  if (note.type === 'checklist') showChecklistEditor(note.items || []);
  else showTextEditor();

  applyColorToEditor();
  applyEditorWidth();
  applyEditorFont();
  updateEditorPinButton();
  updateEditorCharCount();
  updateEditorEmptyState();
  updateBacklinks();
  $('#editor-status-text').textContent = 'Сохранено';
  $('#format-bar').hidden = true;
  $('#tb-format').classList.remove('active');
  $('#tb-checklist').classList.toggle('active', note.type === 'checklist');
  $('#format-bar').querySelectorAll('button[data-cmd="insertUnorderedList"], button[data-cmd="insertOrderedList"]').forEach(b => {
    b.style.display = note.type === 'checklist' ? 'none' : '';
  });
  applyFontSizeToContent();
  updateClearDoneBtn();
  showView('editor');

  const sc = $('#editor-scroll');
  if (sc){
    const saved = scrollPositions.get(note.id) || 0;
    sc.scrollTop = saved;
    setTimeout(() => { sc.scrollTop = saved; }, 30);
  }

  if (!editorPushedHistory){
    try { history.pushState({ editor: true, noteId: id }, ''); editorPushedHistory = true; } catch(e){}
  }
  setTimeout(() => {
    const isEmpty = !note.title && !note.html && !(note.items && note.items.some(i => i.text));
    if (isEmpty) $('#editor-title').focus();
  }, 100);
}

function closeEditorImpl(){
  saveNoteNow();
  hideWikiMenu();
  hideSlashMenu();
  revokeEditorBlobUrls();
  currentNoteId = null;
  document.body.classList.remove('focus-mode');
  showView('library');
  renderLibrary();
}
function closeEditor(){
  if (document.activeElement && document.activeElement.blur) document.activeElement.blur();
  if (currentNoteId){
    const sc = $('#editor-scroll');
    if (sc) scrollPositions.set(currentNoteId, sc.scrollTop);
  }
  if (editorPushedHistory){
    editorPushedHistory = false;
    try { history.back(); } catch(e){ closeEditorImpl(); }
    return;
  }
  closeEditorImpl();
}
window.addEventListener('popstate', () => {
  if ($('#view-editor').classList.contains('active')){
    editorPushedHistory = false;
    closeEditorImpl();
  }
});

/* ============ Wiki links in editor ============ */
function setupLinksInEditor(){
  const content = $('#editor-content');
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  for (const node of nodes){
    if (node.parentElement?.closest('.wikilink')) continue;
    const text = node.nodeValue || '';
    const re = /\[\[([^\]]+)\]\]/g;
    if (!re.test(text)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let lastIdx = 0;
    let m;
    while ((m = re.exec(text))){
      if (m.index > lastIdx) frag.appendChild(document.createTextNode(text.slice(lastIdx, m.index)));
      const label = m[1].trim();
      const span = document.createElement('span');
      span.className = 'wikilink';
      span.dataset.target = label;
      span.textContent = label;
      span.contentEditable = 'false';
      span.addEventListener('click', (e) => {
        e.preventDefault(); e.stopPropagation();
        handleWikilinkClick(label);
      });
      frag.appendChild(span);
      lastIdx = m.index + m[0].length;
    }
    if (lastIdx < text.length) frag.appendChild(document.createTextNode(text.slice(lastIdx)));
    node.parentNode.replaceChild(frag, node);
  }
}

/* ============ Hashtags in editor ============ */
function setupTagsInEditor(){
  const content = $('#editor-content');
  const walker = document.createTreeWalker(content, NodeFilter.SHOW_TEXT);
  const nodes = [];
  let n;
  while ((n = walker.nextNode())) nodes.push(n);
  const re = /(^|\s)(#[а-яёa-z0-9_-]+)/gi;
  for (const node of nodes){
    if (node.parentElement?.closest('.wikilink, .hashtag')) continue;
    const text = node.nodeValue || '';
    re.lastIndex = 0;
    if (!re.test(text)) continue;
    re.lastIndex = 0;
    const frag = document.createDocumentFragment();
    let last = 0;
    let m;
    while ((m = re.exec(text))){
      if (m.index > last) frag.appendChild(document.createTextNode(text.slice(last, m.index)));
      if (m[1]) frag.appendChild(document.createTextNode(m[1]));
      const span = document.createElement('span');
      span.className = 'hashtag';
      span.textContent = m[2];
      frag.appendChild(span);
      last = m.index + m[0].length;
    }
    if (last < text.length) frag.appendChild(document.createTextNode(text.slice(last)));
    node.parentNode.replaceChild(frag, node);
  }
}

function handleWikilinkClick(label){
  const target = notes.find(n => !n.deletedAt && getNoteTitle(n).toLowerCase() === label.toLowerCase());
  if (target){
    saveNoteNow();
    openEditor(target.id);
  } else {
    showConfirm('Создать заметку?', `Заметки «${label}» пока нет. Создать?`, () => {
      const id = uid();
      notes.unshift({
        id, title: label, type: 'text', html: '', items: [], color: 'none',
        folderId: null, pinned: false, createdAt: Date.now(), updatedAt: Date.now(), deletedAt: null
      });
      saveNotes();
      openEditor(id);
    });
  }
}

/* ============ Wiki autocomplete ============ */
function hideWikiMenu(){
  if (wikiMenuEl){ wikiMenuEl.remove(); wikiMenuEl = null; }
  wikiMenuItems = [];
  wikiMenuIndex = 0;
}
function updateWikiActive(){
  if (!wikiMenuEl) return;
  const items = wikiMenuEl.querySelectorAll('button');
  items.forEach((el, i) => el.classList.toggle('active', i === wikiMenuIndex));
  if (items[wikiMenuIndex]) items[wikiMenuIndex].scrollIntoView({ block: 'nearest' });
}
function checkWikiAutocomplete(){
  const sel = window.getSelection();
  if (!sel.rangeCount || !sel.isCollapsed){ hideWikiMenu(); return; }
  const range = sel.getRangeAt(0);
  const node = range.startContainer;
  if (node.nodeType !== 3){ hideWikiMenu(); return; }
  const text = node.nodeValue.slice(0, range.startOffset);
  const match = text.match(/\[\[([^\[\]]*)$/);
  if (!match){ hideWikiMenu(); return; }
  showWikiMenu(match[1], range);
}
function showWikiMenu(query, range){
  const q = query.trim().toLowerCase();
  const candidates = notes.filter(n => n.id !== currentNoteId && !n.deletedAt);
  wikiMenuItems = candidates.filter(n => {
    if (!q) return true;
    return getNoteTitle(n).toLowerCase().includes(q);
  }).slice(0, 8);

  hideWikiMenu();
  const menu = document.createElement('div');
  menu.className = 'wiki-menu';
  menu.id = 'wiki-menu';

  if (!wikiMenuItems.length){
    menu.innerHTML = '<div class="wm-empty">Нет совпадений</div>';
  } else {
    wikiMenuItems.forEach((n, idx) => {
      const btn = document.createElement('button');
      btn.className = idx === 0 ? 'active' : '';
      const title = getNoteTitle(n);
      btn.innerHTML = `<span class="wm-title">${esc(title)}</span><span class="wm-meta">${formatDate(n.updatedAt)}</span>`;
      btn.addEventListener('mousedown', (e) => e.preventDefault());
      btn.addEventListener('click', () => selectWikiItem(n));
      menu.appendChild(btn);
    });
  }

  document.body.appendChild(menu);
  const rect = range.getBoundingClientRect();
  const mw = menu.offsetWidth;
  const mh = menu.offsetHeight;
  let left = rect.left;
  let top = rect.bottom + 4;
  if (left + mw > window.innerWidth - 12) left = window.innerWidth - mw - 12;
  if (top + mh > window.innerHeight - 12) top = rect.top - mh - 4;
  menu.style.left = Math.max(12, left) + 'px';
  menu.style.top = Math.max(12, top) + 'px';
  wikiMenuEl = menu;
  wikiMenuIndex = 0;
}
function selectWikiItem(note){
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const node = range.startContainer;
  if (node.nodeType !== 3) return;
  const text = node.nodeValue;
  const before = text.slice(0, range.startOffset);
  const match = before.match(/\[\[([^\[\]]*)$/);
  if (!match){ hideWikiMenu(); return; }
  const startIdx = range.startOffset - match[0].length;
  const title = getNoteTitle(note);
  const after = text.slice(range.startOffset);
  node.nodeValue = text.slice(0, startIdx) + '[[' + title + ']]' + after;
  const newPos = startIdx + 2 + title.length + 2;
  const r = document.createRange();
  r.setStart(node, newPos);
  r.collapse(true);
  sel.removeAllRanges();
  sel.addRange(r);
  hideWikiMenu();
  markEditorDirty();
}
document.addEventListener('mousedown', (e) => {
  if (wikiMenuEl && !wikiMenuEl.contains(e.target)) hideWikiMenu();
});

/* ============ Backlinks ============ */
function updateBacklinks(){
  const panel = $('#backlinks');
  const list = $('#backlinks-list');
  const count = $('#backlinks-count');
  if (!panel || !list) return;
  const note = notes.find(n => n.id === currentNoteId);
  if (!note){ panel.hidden = true; return; }
  const title = getNoteTitle(note);
  if (!title || title === 'Без названия' || title === 'Список'){ panel.hidden = true; return; }
  const refs = notes.filter(n => {
    if (n.id === note.id || n.deletedAt) return false;
    return (n.links || []).some(l => l.toLowerCase() === title.toLowerCase());
  });
  if (!refs.length){ panel.hidden = true; return; }
  panel.hidden = false;
  if (count) count.textContent = refs.length;
  list.innerHTML = '';
  refs.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'backlink';
    btn.innerHTML = `<span class="backlink-title">${esc(getNoteTitle(r))}</span><span class="backlink-arrow">→</span>`;
    btn.addEventListener('click', () => {
      saveNoteNow();
      openEditor(r.id);
    });
    list.appendChild(btn);
  });
}

/* ============ Slash menu ============ */
let slashMenuEl = null;
function showSlashMenu(){
  hideSlashMenu();
  const content = $('#editor-content');
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const rect = range.getBoundingClientRect();
  const menu = document.createElement('div');
  menu.className = 'slash-menu';
  menu.id = 'slash-menu';
  SLASH_COMMANDS.forEach((cmd) => {
    const btn = document.createElement('button');
    btn.innerHTML = `<span class="sm-icon">${esc(cmd.icon)}</span><span class="sm-label">${esc(cmd.label)}</span><span class="sm-hint">${esc(cmd.hint)}</span>`;
    btn.addEventListener('mousedown', (e) => e.preventDefault());
    btn.addEventListener('click', () => {
      removeSlashTrigger();
      cmd.apply(content);
      markEditorDirty();
      hideSlashMenu();
    });
    menu.appendChild(btn);
  });
  document.body.appendChild(menu);
  const mw = menu.offsetWidth, mh = menu.offsetHeight;
  let left = rect.left;
  let top = rect.bottom + 4;
  if (left + mw > window.innerWidth - 12) left = window.innerWidth - mw - 12;
  if (top + mh > window.innerHeight - 12) top = rect.top - mh - 4;
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  slashMenuEl = menu;
}
function hideSlashMenu(){
  if (slashMenuEl){ slashMenuEl.remove(); slashMenuEl = null; }
}
function removeSlashTrigger(){
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const node = range.startContainer;
  if (node.nodeType === 3){
    const text = node.nodeValue || '';
    const offset = range.startOffset;
    const before = text.slice(0, offset);
    const idx = before.lastIndexOf('/');
    if (idx >= 0 && /^\/[a-z0-9]*$/i.test(before.slice(idx))){
      node.nodeValue = text.slice(0, idx) + text.slice(offset);
      const r = document.createRange();
      r.setStart(node, idx);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
    }
  }
}
function wrapLine(content, tag){
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  let node = range.startContainer;
  while (node && node !== content && node.parentElement !== content) node = node.parentElement;
  if (!node || node === content) return;
  const el = document.createElement(tag);
  el.textContent = node.textContent || '';
  node.parentNode.replaceChild(el, node);
  const r = document.createRange();
  r.selectNodeContents(el);
  r.collapse(false);
  sel.removeAllRanges();
  sel.addRange(r);
}
function wrapBlock(tag){
  const sel = window.getSelection();
  if (!sel.rangeCount) return;
  const range = sel.getRangeAt(0);
  const text = range.toString();
  const el = document.createElement(tag);
  el.textContent = text || '';
  range.deleteContents();
  range.insertNode(el);
  const r = document.createRange();
  r.selectNodeContents(el);
  r.collapse(false);
  sel.removeAllRanges();
  sel.addRange(r);
}

/* ============ Markdown shortcuts ============ */
function handleMarkdownShortcut(e){
  if (e.key !== ' ' && e.key !== 'Enter') return false;
  if (e.ctrlKey || e.metaKey || e.altKey) return false;
  const sel = window.getSelection();
  if (!sel.rangeCount || !sel.isCollapsed) return false;
  const range = sel.getRangeAt(0);
  const node = range.startContainer;
  if (node.nodeType !== 3) return false;
  const textBefore = node.nodeValue.slice(0, range.startOffset);
  const textAfter = node.nodeValue.slice(range.startOffset);
  const lineStart = textBefore.lastIndexOf('\n') + 1;
  const lineText = textBefore.slice(lineStart);
  const nextNl = textAfter.indexOf('\n');
  const restOfLine = nextNl === -1 ? textAfter : textAfter.slice(0, nextNl);
  if (restOfLine.length > 0) return false;

  const deletePattern = () => {
    const delRange = document.createRange();
    delRange.setStart(node, lineStart);
    delRange.setEnd(node, range.startOffset);
    sel.removeAllRanges();
    sel.addRange(delRange);
    document.execCommand('delete');
  };

  if (e.key === 'Enter' && /^-{3,}$/.test(lineText)){
    e.preventDefault();
    deletePattern();
    document.execCommand('insertHorizontalRule');
    document.execCommand('insertParagraph');
    markEditorDirty();
    return true;
  }

  if (e.key !== ' ') return false;

  const hMatch = lineText.match(/^(#{1,6})$/);
  if (hMatch){
    const level = hMatch[1].length;
    e.preventDefault();
    deletePattern();
    document.execCommand('formatBlock', false, 'h' + level);
    markEditorDirty();
    return true;
  }
  if (lineText === '-' || lineText === '*' || lineText === '+'){
    e.preventDefault();
    deletePattern();
    document.execCommand('insertUnorderedList');
    markEditorDirty();
    return true;
  }
  if (/^\d+\.$/.test(lineText)){
    e.preventDefault();
    deletePattern();
    document.execCommand('insertOrderedList');
    markEditorDirty();
    return true;
  }
  if (lineText === '>'){
    e.preventDefault();
    deletePattern();
    document.execCommand('formatBlock', false, 'blockquote');
    markEditorDirty();
    return true;
  }
  if (lineText === '```'){
    e.preventDefault();
    deletePattern();
    document.execCommand('formatBlock', false, 'pre');
    markEditorDirty();
    return true;
  }
  return false;
}

/* ============ Attachments ============ */
async function resolveAttachmentsInEditor(){
  const content = $('#editor-content');
  for (const img of Array.from(content.querySelectorAll('img[data-att-id]'))){
    if (img.parentElement?.classList.contains('img-wrap')){
      const wrap = img.parentElement;
      if (!wrap.dataset.bound){ wrap.dataset.bound = '1'; setupImageWidget(wrap); }
    } else {
      const wrap = document.createElement('span');
      wrap.className = 'img-wrap';
      wrap.contentEditable = 'false';
      wrap.dataset.attId = img.dataset.attId;
      img.parentNode.insertBefore(wrap, img);
      wrap.appendChild(img);
      const del = document.createElement('button');
      del.className = 'img-del';
      del.type = 'button';
      del.textContent = '✕';
      wrap.appendChild(del);
      wrap.dataset.bound = '1';
      setupImageWidget(wrap);
    }
    if (!img.src || !img.src.startsWith('blob:')){
      const blob = await idbGet('att:' + img.dataset.attId);
      if (blob) img.src = trackBlobUrl(URL.createObjectURL(blob));
    }
  }
  for (const vn of content.querySelectorAll('.voice-note[data-att-id]')){
    if (vn.dataset.resolved === '1') continue;
    vn.dataset.resolved = '1';
    setupVoicePlayer(vn);
  }
}
function setupImageWidget(wrap){
  const img = wrap.querySelector('img');
  const del = wrap.querySelector('.img-del');
  if (img && !img.dataset.zoomBound){
    img.dataset.zoomBound = '1';
    img.addEventListener('click', () => {
      if (!img.src) return;
      const lb = $('#lightbox');
      lb.querySelector('img').src = img.src;
      lb.classList.add('show');
    });
  }
  if (del && !del.dataset.bound){
    del.dataset.bound = '1';
    del.addEventListener('click', (e) => {
      e.preventDefault(); e.stopPropagation();
      wrap.remove();
      markEditorDirty();
    });
  }
}
function setupVoicePlayer(vn){
  const playBtn = vn.querySelector('.vn-play');
  if (!playBtn || playBtn.dataset.bound) return;
  playBtn.dataset.bound = '1';
  playBtn.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (playingAudio){ try { playingAudio.pause(); } catch(_){} playingAudio = null; }
    const blob = await idbGet('att:' + vn.dataset.attId);
    if (!blob){ toast('Аудио не найдено'); return; }
    const audio = new Audio(trackBlobUrl(URL.createObjectURL(blob)));
    playingAudio = audio;
    playBtn.textContent = '⏸';
    audio.onended = () => { playBtn.textContent = '▶'; playingAudio = null; };
    audio.onerror = () => { playBtn.textContent = '▶'; playingAudio = null; };
    try { await audio.play(); } catch(e){ playBtn.textContent = '▶'; }
  });
}

/* ============ Editors ============ */
function showTextEditor(){
  $('#editor-content').style.display = '';
  const wrap = $('#checklist-wrap');
  wrap.hidden = true; wrap.style.display = 'none';
  updateClearDoneBtn();
}
function showChecklistEditor(items){
  $('#editor-content').style.display = 'none';
  const wrap = $('#checklist-wrap');
  wrap.hidden = false; wrap.style.display = 'flex';
  wrap.innerHTML = '';
  if (!items.length) items = [{ id: uid(), text: '', done: false }];
  items.forEach(it => wrap.appendChild(renderCheckItem(it)));
  updateClearDoneBtn();
}
function renderCheckItem(it){
  const div = document.createElement('div');
  div.className = 'check-item' + (it.done ? ' done' : '');
  div.dataset.id = it.id;
  div.draggable = true;
  div.innerHTML = `
    <span class="drag-handle" aria-hidden="true">⋮⋮</span>
    <button class="cb" type="button" aria-label="Отметить">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
    </button>
    <div class="ctext" contenteditable="true">${esc(it.text || '')}</div>
    <button class="del" type="button" title="Удалить">✕</button>
  `;
  const cb = div.querySelector('.cb');
  const text = div.querySelector('.ctext');
  const del = div.querySelector('.del');
  cb.addEventListener('click', () => {
    div.classList.toggle('done');
    it.done = div.classList.contains('done');
    vibrate(8);
    markEditorDirty();
    updateClearDoneBtn();
  });
  text.addEventListener('input', () => {
    it.text = text.textContent;
    markEditorDirty();
    updateEditorCharCount();
  });
  text.addEventListener('keydown', (e) => {
    if (e.key === 'Enter' && !e.shiftKey){
      e.preventDefault();
      const newItem = { id: uid(), text: '', done: false };
      const next = renderCheckItem(newItem);
      div.after(next);
      next.querySelector('.ctext').focus();
      markEditorDirty();
    } else if (e.key === 'Backspace' && !text.textContent.trim()){
      const wrap = $('#checklist-wrap');
      const count = wrap.querySelectorAll('.check-item').length;
      if (count > 1){
        e.preventDefault();
        const prev = div.previousElementSibling;
        div.remove();
        if (prev) prev.querySelector('.ctext').focus();
        markEditorDirty();
        updateEditorCharCount();
        updateClearDoneBtn();
      }
    }
  });
  del.addEventListener('click', () => {
    div.remove();
    const wrap = $('#checklist-wrap');
    if (!wrap.querySelector('.check-item')){
      wrap.appendChild(renderCheckItem({ id: uid(), text: '', done: false }));
    }
    markEditorDirty();
    updateEditorCharCount();
    updateClearDoneBtn();
  });
  div.addEventListener('dragstart', (e) => {
    div.classList.add('dragging');
    e.dataTransfer.effectAllowed = 'move';
    e.dataTransfer.setData('text/plain', it.id);
  });
  div.addEventListener('dragend', () => div.classList.remove('dragging'));
  div.addEventListener('dragover', (e) => {
    e.preventDefault();
    e.dataTransfer.dropEffect = 'move';
    div.classList.add('drag-over');
  });
  div.addEventListener('dragleave', () => div.classList.remove('drag-over'));
  div.addEventListener('drop', (e) => {
    e.preventDefault();
    div.classList.remove('drag-over');
    const dragging = $('#checklist-wrap .dragging');
    if (!dragging || dragging === div) return;
    const rect = div.getBoundingClientRect();
    const after = (e.clientY - rect.top) > rect.height / 2;
    if (after) div.after(dragging); else div.before(dragging);
    markEditorDirty();
  });
  return div;
}
function collectChecklistItems(){
  const wrap = $('#checklist-wrap');
  const items = [];
  wrap.querySelectorAll('.check-item').forEach(el => {
    const text = el.querySelector('.ctext').textContent;
    const done = el.classList.contains('done');
    if (text.trim() || done) items.push({ id: el.dataset.id, text, done });
  });
  return items;
}
function updateClearDoneBtn(){
  const btn = $('#clear-done-btn');
  if (!btn) return;
  const note = notes.find(n => n.id === currentNoteId);
  if (!note || note.type !== 'checklist'){ btn.hidden = true; return; }
  const items = collectChecklistItems();
  btn.hidden = !items.some(i => i.done);
}
$('#clear-done-btn')?.addEventListener('click', () => {
  const wrap = $('#checklist-wrap');
  const doneItems = Array.from(wrap.querySelectorAll('.check-item.done'));
  if (!doneItems.length) return;
  const snapshot = doneItems.map(el => ({
    id: el.dataset.id,
    text: el.querySelector('.ctext').textContent,
    done: true
  }));
  doneItems.forEach(el => el.remove());
  if (!wrap.querySelector('.check-item')){
    wrap.appendChild(renderCheckItem({ id: uid(), text: '', done: false }));
  }
  markEditorDirty();
  updateEditorCharCount();
  updateClearDoneBtn();
  toast(`Очищено: ${snapshot.length}`, {
    actionLabel: 'Отменить',
    action: () => {
      const items = collectChecklistItems();
      items.push(...snapshot);
      showChecklistEditor(items);
      markEditorDirty();
      updateEditorCharCount();
      updateClearDoneBtn();
    },
    duration: 5000
  });
});

/* ============ Save + history ============ */
function markEditorDirty(){
  const status = $('#editor-status-text');
  if (status) status.textContent = 'Сохранение…';
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveNoteNow, 500);
}

async function pushHistorySnapshot(note){
  const lastTs = lastHistoryTs.get(note.id) || 0;
  if (Date.now() - lastTs < 60000) return;
  lastHistoryTs.set(note.id, Date.now());
  const rec = {
    key: note.id + ':' + Date.now(),
    noteId: note.id,
    title: note.title || '',
    html: note.html || '',
    items: note.items || [],
    type: note.type,
    color: note.color,
    ts: Date.now()
  };
  try {
    await histPut(rec);
    const all = await histByNote(note.id);
    if (all.length > 20){
      all.sort((a, b) => a.ts - b.ts);
      const toDelete = all.slice(0, all.length - 20);
      for (const r of toDelete) await histDel(r.key);
    }
  } catch(e){}
}

function saveNoteNow(){
  clearTimeout(saveTimer);
  if (!currentNoteId) return;
  const note = notes.find(n => n.id === currentNoteId);
  if (!note) return;

  const title = $('#editor-title').value.trim();
  let html = '', items = [];
  if (note.type === 'checklist'){
    items = collectChecklistItems();
  } else {
    const clone = $('#editor-content').cloneNode(true);
    clone.querySelectorAll('img').forEach(img => {
      if (img.src && img.src.startsWith('blob:')) img.removeAttribute('src');
      img.removeAttribute('data-zoom-bound');
    });
    clone.querySelectorAll('.voice-note').forEach(vn => {
      const p = vn.querySelector('.vn-play');
      if (p) p.removeAttribute('data-bound');
      vn.removeAttribute('data-resolved');
    });
    clone.querySelectorAll('.img-wrap').forEach(w => w.removeAttribute('data-bound'));
    clone.querySelectorAll('.wikilink').forEach(sp => {
      const text = document.createTextNode('[[' + (sp.dataset.target || sp.textContent) + ']]');
      sp.parentNode.replaceChild(text, sp);
    });
    clone.querySelectorAll('.hashtag').forEach(sp => {
      sp.parentNode.replaceChild(document.createTextNode(sp.textContent), sp);
    });
    html = clone.innerHTML;
    html = linkifyHtml(html);
  }

  const hasContent = title
    || items.some(i => i.text.trim())
    || stripHtml(html).length > 0
    || /<img[^>]*data-att-id/.test(html)
    || /class="voice-note"/.test(html);

  if (!hasContent && !note.deletedAt && !note.isDaily){
    const idx = notes.findIndex(n => n.id === note.id);
    if (idx >= 0){
      notes.splice(idx, 1);
      saveNotes();
      if (currentNoteId === note.id){
        currentNoteId = null;
        editorPushedHistory = false;
        showView('library');
        renderLibrary();
      }
    }
    return;
  }

  const oldTitle = note.title, oldHtml = note.html;
  note.title = title;
  note.html = html;
  note.items = items;
  note.color = editorState.color;
  note.pinned = editorState.pinned;
  note.folderId = editorState.folderId;
  note.updatedAt = Date.now();
  note.tags = extractTags(note);
  note.links = extractLinks(note);
  saveNotes();
  updateEditorCharCount();
  updateBacklinks();
  const status = $('#editor-status-text');
  if (status) status.textContent = 'Сохранено';

  if (oldTitle !== title || oldHtml !== html){
    pushHistorySnapshot(note).catch(() => {});
  }
}

function updateEditorCharCount(){
  const note = notes.find(n => n.id === currentNoteId);
  let text = '';
  if (note && note.type === 'checklist'){
    text = collectChecklistItems().map(i => i.text).join(' ');
  } else {
    text = $('#editor-content').textContent || '';
  }
  const charCount = text.length;
  const wordCount = text.trim() ? text.trim().split(/\s+/).length : 0;
  const minutes = wordCount > 0 ? Math.max(1, Math.ceil(wordCount / 200)) : 0;
  const reading = wordCount >= 50 ? ` · ~${minutes} мин` : '';
  const el = $('#editor-count');
  const plain = $('#editor-count-plain');
  const progressInline = $('#progress-inline');
  const progressFill = $('#progress-fill');
  if (settings.wordGoal > 0){
    if (plain) plain.hidden = true;
    if (progressInline) progressInline.hidden = false;
    const pct = clamp(Math.round((wordCount / settings.wordGoal) * 100), 0, 100);
    if (progressFill) progressFill.style.width = pct + '%';
    if (el) el.textContent = `${wordCount}/${settings.wordGoal} ${pluralWords(settings.wordGoal)}${reading}`;
  } else {
    if (plain){ plain.hidden = false; plain.textContent = `${charCount} симв. · ${wordCount} ${pluralWords(wordCount)}${reading}`; }
    if (progressInline) progressInline.hidden = true;
    if (el) el.textContent = '';
  }
  updateClearDoneBtn();
}

function updateEditorEmptyState(){
  const content = $('#editor-content');
  if (!content) return;
  const hasContent = content.textContent.trim().length > 0
    || content.querySelector('img, .voice-note');
  content.dataset.empty = hasContent ? 'false' : 'true';
}
function updateEditorPinButton(){
  const btn = $('#btn-editor-pin');
  if (!btn) return;
  btn.style.opacity = editorState.pinned ? '1' : '0.55';
  btn.title = editorState.pinned ? 'Открепить' : 'Закрепить';
}
function applyColorToEditor(){
  const colors = {
    none: '', yellow: 'var(--note-yellow)', blue: 'var(--note-blue)',
    green: 'var(--note-green)', pink: 'var(--note-pink)', purple: 'var(--note-purple)',
    orange: 'var(--note-orange)', gray: 'var(--note-gray)'
  };
  const el = $('#editor-scroll');
  if (el) el.style.background = colors[editorState.color] || '';
}
function showView(name){
  $('#view-library').classList.toggle('active', name === 'library');
  $('#view-editor').classList.toggle('active', name === 'editor');
}

/* ============ Add menu ============ */
function showAddMenu(){
  const body = $('#actions-sheet-body');
  if (!body) return;
  const today = new Date();
  const dateKey = localDateKey(today);
  const dailyExists = notes.find(n => n.isDaily && n.id === 'daily-' + dateKey);
  body.innerHTML = `
    <div class="sheet-title">Создать</div>
    <button class="sheet-action" data-new="text"><span class="icon">📝</span><span>Пустая заметка</span></button>
    <button class="sheet-action" data-new="checklist"><span class="icon">☑</span><span>Чек-лист</span></button>
    <button class="sheet-action" data-new="daily"><span class="icon">📔</span><span>${dailyExists ? 'Открыть дневник за сегодня' : 'Дневник за сегодня'}</span></button>
    <div class="sheet-divider"></div>
    <button class="sheet-action" data-new="template"><span class="icon">📋</span><span>Из шаблона…</span></button>
    <button class="sheet-action" data-new="import"><span class="icon">⬆</span><span>Импорт .json</span></button>
  `;
  body.querySelectorAll('.sheet-action').forEach(btn => {
    btn.addEventListener('click', () => {
      const act = btn.dataset.new;
      closeSheets();
      if (act === 'text') createNote('text');
      else if (act === 'checklist') createNote('checklist');
      else if (act === 'daily') openDaily();
      else if (act === 'template') setTimeout(openTemplates, 200);
      else if (act === 'import') $('#import-input').click();
    });
  });
  openSheet('#actions-sheet');
}

function createNote(type, opts){
  const id = uid();
  const note = {
    id, title: (opts && opts.title) || '', type: type || 'text',
    html: (opts && opts.html) || '',
    items: (opts && opts.items) || [],
    color: 'none',
    folderId: (settings.filterFolder !== 'all' && settings.filterFolder !== 'trash') ? settings.filterFolder : null,
    pinned: false, createdAt: Date.now(), updatedAt: Date.now(), deletedAt: null,
    tags: [], links: []
  };
  notes.unshift(note);
  saveNotes();
  openEditor(id);
  return id;
}

function openDaily(){
  const today = new Date();
  const dateKey = localDateKey(today);
  const id = 'daily-' + dateKey;
  let note = notes.find(n => n.id === id);
  if (!note){
    const dateLabel = today.toLocaleDateString('ru-RU', { day: 'numeric', month: 'long', year: 'numeric' });
    note = {
      id, title: 'Дневник · ' + dateLabel, type: 'text',
      html: '<p></p>',
      items: [], color: 'none',
      folderId: null, pinned: false,
      createdAt: Date.now(), updatedAt: Date.now(), deletedAt: null,
      tags: [], links: [], isDaily: true
    };
    notes.unshift(note);
    saveNotes();
  }
  openEditor(id);
}

function openTemplates(){
  const list = $('#templates-list');
  if (!list) return;
  list.innerHTML = '';
  TEMPLATES.forEach(tpl => {
    const btn = document.createElement('button');
    btn.className = 'sheet-action';
    btn.innerHTML = `<span class="icon">${tpl.icon}</span><span>${esc(tpl.name)}</span><span class="action-meta">${tpl.type === 'checklist' ? 'Список' : 'Текст'}</span>`;
    btn.addEventListener('click', () => {
      closeSheets();
      const items = tpl.items ? tpl.items.map(it => ({ id: uid(), text: it.text || '', done: !!it.done })) : [];
      createNote(tpl.type || 'text', {
        title: tpl.title,
        html: tpl.html || '',
        items
      });
    });
    list.appendChild(btn);
  });
  openSheet('#templates-sheet');
}

/* ============ Settings ============ */
