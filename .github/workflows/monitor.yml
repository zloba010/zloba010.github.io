      </div>
    </div>
    <div class="settings-group">
      <h4>Статистика</h4>
      <div class="stat-grid">
        <div class="stat-cell"><div class="stat-value">${totalNotes}</div><div class="stat-label">Заметок</div></div>
        <div class="stat-cell"><div class="stat-value">${totalWords}</div><div class="stat-label">Слов</div></div>
        <div class="stat-cell"><div class="stat-value">${totalTags}</div><div class="stat-label">Тегов</div></div>
        <div class="stat-cell"><div class="stat-value">${days}</div><div class="stat-label">Дней</div></div>
