          <button data-v="dark" class="${settings.theme === 'dark' ? 'active' : ''}">Тёмная</button>
          <button data-v="glass" class="${settings.theme === 'glass' ? 'active' : ''}">Стекло</button>
        </div>
      </div>
      <div class="settings-row">
        <div class="setting-label">Ширина редактора</div>
        <div class="segmented" id="set-width">
          <button data-v="narrow" class="${settings.editorWidth === 'narrow' ? 'active' : ''}">Узкий</button>
          <button data-v="normal" class="${settings.editorWidth === 'normal' ? 'active' : ''}">Обычный</button>
          <button data-v="wide" class="${settings.editorWidth === 'wide' ? 'active' : ''}">Широкий</button>
        </div>
      </div>
      <div class="settings-row">
        <div class="setting-label">Шрифт</div>
        <div class="segmented" id="set-font">
          <button data-v="system" class="${settings.fontStyle === 'system' ? 'active' : ''}">Система</button>
          <button data-v="serif" class="${settings.fontStyle === 'serif' ? 'active' : ''}">Serif</button>
          <button data-v="mono" class="${settings.fontStyle === 'mono' ? 'active' : ''}">Mono</button>
        </div>
      </div>
      <div class="settings-row">
        <div class="setting-label">Размер шрифта</div>
        <input type="number" class="settings-number" id="set-fs" min="12" max="24" value="${settings.fontSize || 16}">
      </div>
    </div>
    <div class="settings-group">
      <h4>Цель</h4>
      <div class="settings-row">
