      <div class="sheet-divider"></div>
      <button class="sheet-action danger" data-act="delete-permanent"><span class="icon">🗑</span><span>Удалить навсегда</span></button>
    `;
  } else {
    body.innerHTML = `
      <div class="sheet-title">${esc(displayTitle)}</div>
      <button class="sheet-action" data-act="pin"><span class="icon">${editorState.pinned ? '📌' : '📍'}</span><span>${editorState.pinned ? 'Открепить' : 'Закрепить'}</span></button>
      <button class="sheet-action" data-act="color"><span class="icon">🎨</span><span>Цвет фона</span></button>
      <button class="sheet-action" data-act="move"><span class="icon">📁</span><span>Переместить в папку</span></button>
      <div class="sheet-divider"></div>
      <button class="sheet-action" data-act="duplicate"><span class="icon">⎘</span><span>Создать копию</span></button>
      <button class="sheet-action" data-act="copy"><span class="icon">📋</span><span>Копировать текст</span></button>
      <button class="sheet-action" data-act="export-txt"><span class="icon">⬇</span><span>Скачать .txt</span></button>
      <button class="sheet-action" data-act="print"><span class="icon">🖨</span><span>Печать / PDF</span></button>
      <button class="sheet-action" data-act="history"><span class="icon">🕒</span><span>История версий</span></button>
      <button class="sheet-action" data-act="share"><span class="icon">↗</span><span>Поделиться</span></button>
      <div class="sheet-divider"></div>
      <button class="sheet-action danger" data-act="delete"><span class="icon">🗑</span><span>Удалить</span></button>
    `;
  }
  body.querySelectorAll('.sheet-action').forEach(btn => {
    btn.addEventListener('click', () => handleActionSheet(btn.dataset.act));
  });
  openSheet('#actions-sheet');
}

async function handleActionSheet(act){
  const note = notes.find(n => n.id === currentNoteId);
  if (!note) return;
  switch (act){
    case 'pin':
      editorState.pinned = !editorState.pinned;
      updateEditorPinButton(); saveNoteNow(); closeSheets();
      toast(editorState.pinned ? 'Закреплено' : 'Откреплено');
      break;
    case 'color':
      closeSheets(); setTimeout(openColorSheet, 200);
      break;
    case 'move':
      closeSheets(); setTimeout(() => openMoveModal([note.id]), 200);
      break;
    case 'duplicate': {
      saveNoteNow();
      const copy = JSON.parse(JSON.stringify(note));
      copy.id = uid();
      copy.title = (note.title || 'Без названия') + ' (копия)';
      copy.createdAt = Date.now();
      copy.updatedAt = Date.now();
      copy.deletedAt = null;
      copy.pinned = false;
      if (note.html){
        const matches = Array.from(note.html.matchAll(/data-att-id="([^"]+)"/g));
        for (const m of matches){
          const oldId = m[1];
          const blob = await idbGet('att:' + oldId);
          if (blob){
            const newAttId = uid();
            await idbPut('att:' + newAttId, blob);
            copy.html = copy.html.replace(
              new RegExp('data-att-id="' + oldId.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + '"', 'g'),
              'data-att-id="' + newAttId + '"'
            );
          }
        }
      }
      notes.unshift(copy);
      saveNotes();
      closeSheets(); closeEditor();
      toast('Копия создана');
      break;
    }
    case 'copy': {
      const text = note.type === 'checklist'
        ? (note.items || []).map(i => (i.done ? '☑ ' : '☐ ') + i.text).join('\n')
        : stripHtml(note.html || '');
      try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
      catch(e){ toast('Не удалось скопировать'); }
      closeSheets();
      break;
    }
    case 'export-txt': {
      const text = note.type === 'checklist'
        ? (note.items || []).map(i => (i.done ? '[x] ' : '[ ] ') + i.text).join('\n')
        : stripHtml(note.html || '');
      const title = getNoteTitle(note);
      const content = title + '\n\n' + text;
      const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = title.replace(/[\\/:*?"<>|]/g, '_').slice(0, 60) + '.txt';
      a.click();
      setTimeout(() => URL.revokeObjectURL(url), 3000);
      closeSheets();
      toast('Скачано');
      break;
    }
    case 'print':
      closeSheets();
      setTimeout(() => window.print(), 100);
      break;
    case 'history':
      closeSheets(); setTimeout(openHistory, 200);
      break;
    case 'share': {
      const text = note.type === 'checklist'
        ? (note.items || []).map(i => (i.done ? '☑ ' : '☐ ') + i.text).join('\n')
        : stripHtml(note.html || '');
      if (navigator.share){
        try { await navigator.share({ title: getNoteTitle(note), text }); } catch(e){}
      } else {
        try { await navigator.clipboard.writeText(text); toast('Скопировано'); }
        catch(e){ toast('Не поддерживается'); }
      }
      closeSheets();
      break;
    }
    case 'delete': {
      showConfirm('Переместить в корзину?', 'Восстановить можно в течение 30 дней.', () => {
        note.deletedAt = Date.now();
        note.updatedAt = Date.now();
        saveNotes(); closeSheets(); closeEditor();
        toast('Перемещено в корзину', {
          actionLabel: 'Отменить',
          action: () => {
            note.deletedAt = null;
            note.updatedAt = Date.now();
            saveNotes();
            renderLibrary();
          },
          duration: 5000
        });
      });
      break;
    }
    case 'restore':
      note.deletedAt = null;
      note.updatedAt = Date.now();
      saveNotes(); closeSheets(); closeEditor();
      if (settings.filterFolder === 'trash'){ settings.filterFolder = 'all'; saveSettings(); renderLibrary(); }
      toast('Восстановлено');
      break;
    case 'delete-permanent':
      showConfirm('Удалить навсегда?', 'Это действие нельзя отменить.', () => {
        if (note.html){
          const matches = note.html.matchAll(/data-att-id="([^"]+)"/g);
          for (const m of matches) idbDel('att:' + m[1]).catch(() => {});
        }
        notes = notes.filter(n => n.id !== note.id);
        saveNotes(); closeSheets(); closeEditor();
        toast('Удалено');
      });
      break;
  }
}

/* ============ Sheets ============ */
function openSheet(selector){
  closeSheets();
  const el = $(selector);
  if (!el) return;
  el.classList.add('open');
  $('#overlay').classList.add('show');
}
function closeSheets(){
  $$('.sheet').forEach(s => s.classList.remove('open'));
  $('#overlay').classList.remove('show');
}
$('#overlay')?.addEventListener('click', closeSheets);

/* ============ Tags sheet ============ */
function openTagsSheet(){
  const list = $('#tags-list');
  if (!list) return;
  const tagCounts = new Map();
  notes.filter(n => !n.deletedAt).forEach(n => {
    (n.tags || []).forEach(t => {
      tagCounts.set(t, (tagCounts.get(t) || 0) + 1);
    });
  });
  const sorted = Array.from(tagCounts.entries()).sort((a, b) => b[1] - a[1]);
  list.innerHTML = '';
  if (!sorted.length){
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">Пока нет тегов. Добавьте #тег в текст заметки.</div>';
  } else {
    sorted.forEach(([tag, count]) => {
      const btn = document.createElement('button');
      btn.className = 'sheet-action' + (settings.filterTag === tag ? ' active' : '');
      btn.style.fontWeight = settings.filterTag === tag ? '700' : '';
      btn.innerHTML = `<span class="icon">#</span><span>${esc(tag)}</span><span class="action-meta">${count}</span>`;
      btn.addEventListener('click', () => {
        settings.filterTag = tag;
        settings.filterFolder = 'all';
        settings.filterType = 'all';
        saveSettings();
        closeSheets();
        renderLibrary();
      });
      list.appendChild(btn);
    });
  }
  if (settings.filterTag){
    const clear = document.createElement('button');
    clear.className = 'sheet-action';
    clear.style.color = '#c94a4a';
    clear.innerHTML = `<span class="icon">✕</span><span>Сбросить фильтр тегов</span>`;
    clear.addEventListener('click', () => {
      settings.filterTag = null; saveSettings(); closeSheets(); renderLibrary();
    });
    list.appendChild(clear);
  }
  openSheet('#tags-sheet');
}

/* ============ Folder modal ============ */
function openFolderModal(mode, folderId){
  folderEditId = mode === 'edit' ? folderId : null;
  const modal = $('#folder-modal');
  const title = $('#folder-modal-title');
  const input = $('#folder-name-input');
  const saveBtn = $('#folder-save');
  const delBtn = $('#folder-delete');
  if (mode === 'edit'){
    const f = folders.find(x => x.id === folderId);
    if (!f) return;
    title.textContent = 'Папка';
    input.value = f.name;
    saveBtn.textContent = 'Сохранить';
    delBtn.style.display = '';
  } else {
    title.textContent = 'Новая папка';
    input.value = '';
    saveBtn.textContent = 'Создать';
    delBtn.style.display = 'none';
  }
  modal.classList.add('show');
  setTimeout(() => { input.focus(); input.select(); }, 50);
}
function closeFolderModal(){ $('#folder-modal').classList.remove('show'); folderEditId = null; }
$('#folder-cancel')?.addEventListener('click', closeFolderModal);
$('#folder-save')?.addEventListener('click', () => {
  const name = ($('#folder-name-input').value || '').trim();
  if (!name){ toast('Введите название'); return; }
  if (folderEditId){
    const f = folders.find(x => x.id === folderEditId);
    if (f){ f.name = name; saveFolders(); }
  } else {
    folders.push({ id: uid(), name, createdAt: Date.now() });
    saveFolders();
  }
  closeFolderModal();
  renderLibrary();
});
$('#folder-delete')?.addEventListener('click', () => {
  if (!folderEditId) return;
  const f = folders.find(x => x.id === folderEditId);
  if (!f) return;
  showConfirm(`Удалить папку «${f.name}»?`, 'Заметки останутся без папки.', () => {
    folders = folders.filter(x => x.id !== folderEditId);
    saveFolders();
    notes.forEach(n => { if (n.folderId === folderEditId) n.folderId = null; });
    saveNotes();
    if (settings.filterFolder === folderEditId){ settings.filterFolder = 'all'; saveSettings(); }
    closeFolderModal(); renderLibrary();
  });
});
