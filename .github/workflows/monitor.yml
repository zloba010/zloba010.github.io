/* ============ Export / Import ============ */
function exportLibrary(){
  const data = {
    version: 2,
    exportedAt: new Date().toISOString(),
    notes, folders, settings
  };
  const blob = new Blob([JSON.stringify(data, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  const d = new Date();
  const stamp = `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
  a.href = url;
  a.download = `kizamia-notes-${stamp}.json`;
  a.click();
  setTimeout(() => URL.revokeObjectURL(url), 3000);
  toast('Экспортировано');
  closeSheets();
}

async function importLibrary(file){
  try {
    const text = await file.text();
    const data = JSON.parse(text);
    if (!data.notes || !Array.isArray(data.notes)) throw new Error('Неверный формат');
    const existingIds = new Set(notes.map(n => n.id));
    let imported = 0, skipped = 0;
    for (const n of data.notes){
      if (!n || !n.id) continue;
      if (existingIds.has(n.id)){ skipped++; continue; }
      notes.push(n);
      imported++;
    }
    if (Array.isArray(data.folders)){
      const existingFolders = new Set(folders.map(f => f.id));
      for (const f of data.folders){
        if (f && f.id && !existingFolders.has(f.id)) folders.push(f);
      }
      saveFolders();
    }
    saveNotes();
    renderLibrary();
    closeSheets();
    toast(`Импортировано: ${imported}${skipped ? `, пропущено: ${skipped}` : ''}`);
  } catch(e){
    toast('Ошибка импорта');
  }
}

/* ============ History ============ */
async function openHistory(){
  const note = notes.find(n => n.id === currentNoteId);
  if (!note){ toast('Откройте заметку'); return; }
  const list = $('#history-list');
  if (!list) return;
  list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">Загрузка…</div>';
  openSheet('#history-sheet');
  const records = await histByNote(note.id);
  records.sort((a, b) => b.ts - a.ts);
  list.innerHTML = '';
  if (!records.length){
    list.innerHTML = '<div style="padding:20px;text-align:center;color:var(--text-dim);font-size:13px;">Снимков пока нет. История сохраняется автоматически при редактировании.</div>';
    return;
  }
  records.forEach(r => {
    const btn = document.createElement('button');
    btn.className = 'sheet-action';
    btn.innerHTML = `<span class="icon">🕒</span><span>${new Date(r.ts).toLocaleString('ru-RU', { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' })}</span><span class="action-meta">${(r.title || 'Без названия').slice(0, 30)}</span>`;
    btn.addEventListener('click', () => {
      showConfirm('Восстановить версию?', 'Текущее содержимое будет сохранено в истории.', () => {
        restoreFromHistory(r);
      });
    });
    list.appendChild(btn);
  });
}
async function restoreFromHistory(r){
  const note = notes.find(n => n.id === r.noteId);
  if (!note) return;
  await pushHistorySnapshot(note);
  note.title = r.title;
  note.html = r.html;
  note.items = r.items;
  note.type = r.type;
  note.color = r.color;
  note.updatedAt = Date.now();
  note.tags = extractTags(note);
  note.links = extractLinks(note);
  saveNotes();
  closeSheets();
  openEditor(note.id);
  toast('Версия восстановлена');
}

/* ============ Voice recording ============ */
function hideRecordingBar(){
  const bar = $('#recording-bar');
  if (bar) bar.hidden = true;
  if (recordingTimerId){ clearInterval(recordingTimerId); recordingTimerId = null; }
}
function showRecordingBar(){
  const bar = $('#recording-bar');
  if (bar) bar.hidden = false;
  const timeEl = $('#rec-time');
  recordingStart = Date.now();
  if (recordingTimerId) clearInterval(recordingTimerId);
  recordingTimerId = setInterval(() => {
    const sec = Math.floor((Date.now() - recordingStart) / 1000);
    if (timeEl) timeEl.textContent = formatDuration(sec);
  }, 250);
  const pauseBtn = $('#rec-pause');
  if (pauseBtn) pauseBtn.textContent = '⏸';
}
function cancelRecording(){
  if (!recorder) return;
  recordingDiscarded = true;
  try { recorder.stop(); } catch(e){}
}
$('#rec-cancel')?.addEventListener('click', cancelRecording);
$('#rec-stop')?.addEventListener('click', () => {
  if (recorder && recorder.state !== 'inactive'){ recordingDiscarded = false; recorder.stop(); }
});
$('#rec-pause')?.addEventListener('click', () => {
  if (!recorder) return;
  if (recorder.state === 'recording'){ recorder.pause(); $('#rec-pause').textContent = '▶'; }
  else if (recorder.state === 'paused'){ recorder.resume(); $('#rec-pause').textContent = '⏸'; }
});
function updateVoiceBtn(){
  const btn = $('#tb-voice');
  if (!btn) return;
  btn.textContent = '🎙';
  btn.classList.remove('active');
}
$('#tb-voice')?.addEventListener('pointerdown', saveSelection);
$('#tb-voice')?.addEventListener('click', async () => {
  const note = notes.find(n => n.id === currentNoteId);
  if (!note) return;
  if (note.type === 'checklist'){ toast('Голос — только в текстовых заметках'); return; }
  if (recorder){
    if (recorder.state === 'recording' || recorder.state === 'paused'){ recordingDiscarded = false; recorder.stop(); }
    return;
  }
  try {
    const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
    recorder = new MediaRecorder(stream);
    recordingChunks = [];
    recordingDiscarded = false;
    showRecordingBar();
    recorder.ondataavailable = (e) => { if (e.data.size > 0) recordingChunks.push(e.data); };
    recorder.onstop = async () => {
      const duration = Math.round((Date.now() - recordingStart) / 1000);
      stream.getTracks().forEach(t => t.stop());
      const wasDiscarded = recordingDiscarded;
      const chunks = recordingChunks.slice();
      const mime = recorder.mimeType || 'audio/webm';
      recorder = null;
      hideRecordingBar();
      if (wasDiscarded){ toast('Запись отменена'); return; }
      const blob = new Blob(chunks, { type: mime });
      if (blob.size < 500){ toast('Запись слишком короткая'); return; }
      const attId = uid();
      try { await idbPut('att:' + attId, blob); }
      catch(err){ toast('Не удалось сохранить аудио'); return; }
      const vn = document.createElement('div');
      vn.className = 'voice-note';
      vn.contentEditable = 'false';
      vn.dataset.attId = attId;
      vn.dataset.resolved = '1';
      vn.innerHTML = `
        <button class="vn-play" type="button">▶</button>
        <div class="vn-info">
          <span class="vn-time">${formatDuration(duration)}</span>
          <span class="vn-label">Голосовая заметка</span>
        </div>
      `;
      setupVoicePlayer(vn);
      const content = $('#editor-content');
      content.focus();
      if (!restoreSelection()){
        content.appendChild(vn);
        content.appendChild(document.createElement('br'));
      } else {
        const sel = window.getSelection();
        const range = sel.getRangeAt(0);
        range.deleteContents();
        range.insertNode(vn);
        const br = document.createElement('br');
        vn.after(br);
        const r2 = document.createRange();
        r2.setStartAfter(br);
        r2.collapse(true);
        sel.removeAllRanges();
        sel.addRange(r2);
      }
      markEditorDirty();
      updateEditorEmptyState();
      toast('Голос добавлен');
    };
    recorder.start();
    toast('Запись…');
  } catch(err){
    toast('Нет доступа к микрофону');
    recorder = null;
    hideRecordingBar();
  }
});

/* ============ Voice dictation (в текст) ============ */
async function toggleDictation(){
  const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SR){
    toast('Голосовой ввод не поддерживается. Нужен Chrome, Edge или Safari 14.1+.');
    return;
  }
  const note = notes.find(n => n.id === currentNoteId);
  if (!note || note.type === 'checklist'){ toast('Только в текстовых заметках'); return; }

  if (dictationActive){
    dictationStopped = true;
    try { dictation.stop(); } catch(e){}
    return;
  }

  const content = $('#editor-content');
  content.focus({ preventScroll: true });
  const sel = window.getSelection();
  if (sel && sel.rangeCount > 0){
    const r = sel.getRangeAt(0);
    if (content.contains(r.startContainer)){
      lastEditorCaret = r.cloneRange();
    }
  }

  dictation = new SR();
  dictation.lang = 'ru-RU';
  dictation.continuous = true;
  dictation.interimResults = true;
  dictation.maxAlternatives = 1;

  dictationStopped = false;
  dictationRestartAttempts = 0;
  dictationFinalCount = 0;

  const statusEl = $('#voice-status');

  dictation.onstart = () => {
    dictationActive = true;
    $('#voice-input-bar').hidden = false;
    if (statusEl) statusEl.textContent = '🎤 Слушаю… Говорите';
    $('#tb-dictate').classList.add('active');
    console.log('[dictation] STARTED');
  };

  dictation.onspeechstart = () => {
    console.log('[dictation] speech detected');
    if (statusEl) statusEl.textContent = '👂 Слышу речь…';
  };

  dictation.onspeechend = () => {
    console.log('[dictation] speech end');
  };

  dictation.onresult = (e) => {
    let finalText = '';
    let interimText = '';
    for (let i = e.resultIndex; i < e.results.length; i++){
      const r = e.results[i];
      const t = r[0] ? r[0].transcript : '';
      if (r.isFinal){ finalText += t + ' '; }
      else { interimText += t; }
    }

    console.log('[dictation] RESULT final="' + finalText + '" interim="' + interimText + '"');

    if (interimText && statusEl){
      statusEl.textContent = '👂 ' + interimText.slice(0, 60);
    }

    if (finalText.trim()){
      dictationFinalCount++;
      insertDictationText(finalText);
      if (statusEl) statusEl.textContent = '✓ +' + dictationFinalCount + ' фраз';
      markEditorDirty();
      updateEditorEmptyState();
      updateEditorCharCount();
    }
  };

  dictation.onerror = (e) => {
    console.error('[dictation] ERROR:', e.error, e.message);
    if (e.error === 'no-speech'){
      if (statusEl) statusEl.textContent = '🔇 Тишина — говорите громче';
    } else if (e.error === 'not-allowed'){
      toast('Доступ к микрофону запрещён. Разрешите в браузере.');
      dictationStopped = true;
    } else if (e.error === 'network'){
      toast('Нет связи с сервером распознавания. Проверьте интернет.');
      dictationStopped = true;
    } else if (e.error === 'language-not-supported'){
      toast('Русский язык не поддерживается.');
      dictationStopped = true;
    } else if (e.error === 'service-not-allowed'){
      toast('Сервис распознавания недоступен. Нужен https или localhost.');
      dictationStopped = true;
    } else if (e.error === 'aborted'){
      /* пользователь остановил — тихо */
    }
  };

  dictation.onend = () => {
    console.log('[dictation] END, stopped=' + dictationStopped + ' count=' + dictationFinalCount + ' attempts=' + dictationRestartAttempts);
    dictationActive = false;
    $('#tb-dictate').classList.remove('active');

    if (!dictationStopped && dictationRestartAttempts < 10){
      dictationRestartAttempts++;
      setTimeout(() => {
        try { dictation.start(); } catch(e){ console.error('[dictation] restart failed', e); }
      }, 150);
      return;
    }

    $('#voice-input-bar').hidden = true;
    if (statusEl) statusEl.textContent = 'Слушаю…';
    if (dictationFinalCount > 0){
      toast('Распознано фраз: ' + dictationFinalCount);
    } else {
      toast('Ничего не распознано. Проверьте микрофон.');
    }
  };

  try {
    dictation.start();
    console.log('[dictation] start() called');
  } catch(err){
    console.error('[dictation] start() threw', err);
    toast('Не удалось запустить микрофон: ' + err.message);
  }
}

function insertDictationText(text){
  const content = $('#editor-content');
  if (!content) return false;

  try {
    content.focus({ preventScroll: true });
    const sel = window.getSelection();
    if (sel){
      let validRange = null;
      if (sel.rangeCount > 0){
        const r = sel.getRangeAt(0);
        if (content.contains(r.startContainer)) validRange = r;
      }
      if (!validRange && lastEditorCaret && content.contains(lastEditorCaret.startContainer)){
        validRange = lastEditorCaret.cloneRange();
      }
      if (!validRange){
        validRange = document.createRange();
        validRange.selectNodeContents(content);
        validRange.collapse(false);
      }
      sel.removeAllRanges();
      sel.addRange(validRange);

      const beforeHtml = content.innerHTML;
      try { document.execCommand('insertText', false, text); } catch(e){}
      if (content.innerHTML !== beforeHtml){
        if (sel.rangeCount > 0){
          const r = sel.getRangeAt(0);
          if (content.contains(r.startContainer)){
            lastEditorCaret = r.cloneRange();
          }
        }
        console.log('[insert] via execCommand');
        return true;
      }
    }
  } catch(e){
    console.error('[insert] execCommand failed', e);
  }

  try {
    let targetNode, targetOffset;
    if (lastEditorCaret && content.contains(lastEditorCaret.startContainer)){
      targetNode = lastEditorCaret.startContainer;
      targetOffset = lastEditorCaret.startOffset;
    } else {
      targetNode = content;
      targetOffset = content.childNodes.length;
    }

    if (targetNode.nodeType === 3){
      const before = targetNode.nodeValue.slice(0, targetOffset);
      const after = targetNode.nodeValue.slice(targetOffset);
      targetNode.nodeValue = before + text + after;
      const nr = document.createRange();
      nr.setStart(targetNode, targetOffset + text.length);
      nr.collapse(true);
      lastEditorCaret = nr.cloneRange();
    } else {
      const textNode = document.createTextNode(text);
      const refNode = targetNode.childNodes[targetOffset] || null;
      targetNode.insertBefore(textNode, refNode);
      const nr = document.createRange();
      nr.setStartAfter(textNode);
      nr.collapse(true);
      lastEditorCaret = nr.cloneRange();
    }
    console.log('[insert] via direct DOM');
    return true;
  } catch(e){
    console.error('[insert] direct DOM failed', e);
    return false;
  }
}
$('#tb-dictate')?.addEventListener('click', toggleDictation);
$('#voice-stop')?.addEventListener('click', () => {
  if (dictation){
    dictationStopped = true;
    try { dictation.stop(); } catch(e){}
  }
});

