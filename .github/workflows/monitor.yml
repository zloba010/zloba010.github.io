<script>
"use strict";

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const esc = (s) => String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const clamp = (v, a, b) => Math.max(a, Math.min(b, v));
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 8);

const LS = {
  get(k, d){ try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : d; } catch { return d; } },
  set(k, v){ try { localStorage.setItem(k, JSON.stringify(v)); } catch(e){} }
};

/* ============ IndexedDB ============ */
const DB_NAME = 'kizami-notes', DB_VER = 2, STORE = 'blobs', HIST = 'history';
let _dbPromise = null;
function idb(){
  if (_dbPromise) return _dbPromise;
  _dbPromise = new Promise((resolve, reject) => {
    if (!('indexedDB' in window)){ reject(new Error('IndexedDB недоступен')); return; }
    const req = indexedDB.open(DB_NAME, DB_VER);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(STORE)) db.createObjectStore(STORE);
      if (!db.objectStoreNames.contains(HIST)){
        const hs = db.createObjectStore(HIST, { keyPath: 'key' });
        hs.createIndex('noteId', 'noteId', { unique: false });
      }
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error);
  });
  return _dbPromise;
}
async function idbPut(key, val){
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(STORE, 'readwrite');
    tx.objectStore(STORE).put(val, key);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function idbGet(key){
  try {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readonly');
      const r = tx.objectStore(STORE).get(key);
      r.onsuccess = () => res(r.result);
      r.onerror = () => rej(r.error);
    });
  } catch(e){ return null; }
}
async function idbDel(key){
  try {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(STORE, 'readwrite');
      tx.objectStore(STORE).delete(key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  } catch(e){}
}
async function histPut(rec){
  const db = await idb();
  return new Promise((res, rej) => {
    const tx = db.transaction(HIST, 'readwrite');
    tx.objectStore(HIST).put(rec);
    tx.oncomplete = () => res();
    tx.onerror = () => rej(tx.error);
  });
}
async function histByNote(noteId){
  try {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(HIST, 'readonly');
      const idx = tx.objectStore(HIST).index('noteId');
      const r = idx.getAll(noteId);
      r.onsuccess = () => res(r.result || []);
      r.onerror = () => rej(r.error);
    });
  } catch(e){ return []; }
}
async function histDel(key){
  try {
    const db = await idb();
    return new Promise((res, rej) => {
      const tx = db.transaction(HIST, 'readwrite');
      tx.objectStore(HIST).delete(key);
      tx.oncomplete = () => res();
      tx.onerror = () => rej(tx.error);
    });
  } catch(e){}
}

/* ============ State ============ */
const KEYS = {
  notes: 'kizami.notes.v1',
  folders: 'kizami.notes.folders.v1',
  settings: 'kizami.notes.settings.v1'
};
const NOTE_COLORS = ['none', 'yellow', 'blue', 'green', 'pink', 'purple', 'orange', 'gray'];
const COLOR_LABELS = { none: 'По умолчанию', yellow: 'Жёлтый', blue: 'Голубой', green: 'Зелёный', pink: 'Розовый', purple: 'Фиолетовый', orange: 'Оранжевый', gray: 'Серый' };
const THEME_CYCLE = ['light', 'dark', 'glass'];
const THEME_ICONS = { light: '☾', dark: '💧', glass: '☀' };
const ICON_GRID = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>';
const ICON_LIST = '<svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>';

const TEMPLATES = [
  { id: 'meeting', name: 'Встреча', icon: '👥', title: 'Встреча', html: '<h2>Участники</h2><p></p><h2>Повестка</h2><ul><li></li></ul><h2>Решения</h2><p></p><h2>Действия</h2><ul><li></li></ul>' },
  { id: 'idea', name: 'Идея', icon: '💡', title: 'Идея', html: '<p><b>Что:</b> </p><p><b>Зачем:</b> </p><p><b>Как:</b> </p><p><b>Следующий шаг:</b> </p>' },
  { id: 'todo', name: 'To-do', icon: '☑', type: 'checklist', title: 'Задачи', items: [{ text: '', done: false }, { text: '', done: false }, { text: '', done: false }] },
  { id: 'shopping', name: 'Покупки', icon: '🛒', type: 'checklist', title: 'Покупки', items: [{ text: 'Хлеб', done: false }, { text: 'Молоко', done: false }, { text: 'Яйца', done: false }] },
  { id: 'note', name: 'Конспект', icon: '📚', title: 'Конспект', html: '<h2>Тема</h2><p></p><h2>Ключевые пункты</h2><ul><li></li></ul><h2>Выводы</h2><p></p>' },
  { id: 'journal', name: 'Дневник', icon: '📔', title: 'Дневник', html: '<h3>Что хорошего случилось?</h3><p></p><h3>Что можно улучшить?</h3><p></p><h3>Планы на завтра</h3><p></p>' }
];

const SLASH_COMMANDS = [
  { id: 'h1', label: 'Заголовок 1', icon: 'H1', hint: '/h1', apply: (c) => wrapLine(c, 'h1') },
  { id: 'h2', label: 'Заголовок 2', icon: 'H2', hint: '/h2', apply: (c) => wrapLine(c, 'h2') },
  { id: 'h3', label: 'Заголовок 3', icon: 'H3', hint: '/h3', apply: (c) => wrapLine(c, 'h3') },
  { id: 'ul', label: 'Маркированный список', icon: '•', hint: '/ul', apply: () => document.execCommand('insertUnorderedList') },
  { id: 'ol', label: 'Нумерованный список', icon: '1.', hint: '/ol', apply: () => document.execCommand('insertOrderedList') },
  { id: 'quote', label: 'Цитата', icon: '"', hint: '/quote', apply: (c) => wrapLine(c, 'blockquote') },
  { id: 'code', label: 'Блок кода', icon: '</>', hint: '/code', apply: () => wrapBlock('pre') },
  { id: 'hr', label: 'Разделитель', icon: '—', hint: '/hr', apply: () => document.execCommand('insertHorizontalRule') },
