<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4a3728">
<title>Заметки — Kizamia</title>
<style>
:root{ --radius:16px; --ease:cubic-bezier(.2,.7,.3,1); --editor-w:820px; }

[data-theme="light"]{
  --bg:#e6e2db; --bg-2:#ded9d1; --surface:#f4f2ed; --surface-2:#ebe8e2;
  --text:#2b2018; --text-dim:#7d6c5b; --accent:#4a3728; --accent-2:#6d5442;
  --on-accent:#f4f2ed; --border:#d2ccc3;
  --shadow:0 8px 26px rgba(74,55,40,.14); --overlay:rgba(43,32,24,.45);
  --note-yellow:#fdf6c0; --note-blue:#d6e7f3; --note-green:#d3ecd3;
  --note-pink:#f5d8e0; --note-purple:#e2d6ef; --note-orange:#fadec4; --note-gray:#e6e3de;
  --tag-bg:rgba(74,55,40,.10); --link-bg:rgba(66,153,225,.15); --link-text:#2c6fa8;
}
[data-theme="dark"]{
  --bg:#17110d; --bg-2:#100c09; --surface:#241c16; --surface-2:#2f251d;
  --text:#eae6df; --text-dim:#a2948a; --accent:#ded8ce; --accent-2:#bdb3a7;
  --on-accent:#1c1511; --border:#3a2d23;
  --shadow:0 8px 26px rgba(0,0,0,.5); --overlay:rgba(0,0,0,.62);
  --note-yellow:#3a3518; --note-blue:#1a2735; --note-green:#1a301a;
  --note-pink:#351a25; --note-purple:#281a35; --note-orange:#35251a; --note-gray:#2a2724;
  --tag-bg:rgba(255,255,255,.10); --link-bg:rgba(66,153,225,.25); --link-text:#7db4e8;
}
[data-theme="glass"]{
  --bg:transparent; --bg-2:rgba(255,255,255,0.15);
  --surface:rgba(255,255,255,0.18); --surface-2:rgba(255,255,255,0.28);
  --text:#2d3748; --text-dim:#64748b; --accent:#4299e1; --accent-2:#3182ce;
  --on-accent:#ffffff; --border:rgba(255,255,255,0.7);
  --shadow:0 8px 32px rgba(0,0,0,0.08); --overlay:rgba(45,55,72,0.35);
  --note-yellow:rgba(253,246,192,0.7); --note-blue:rgba(214,231,243,0.7);
  --note-green:rgba(211,236,211,0.7); --note-pink:rgba(245,216,224,0.7);
  --note-purple:rgba(226,214,239,0.7); --note-orange:rgba(250,222,196,0.7);
  --note-gray:rgba(230,227,222,0.7);
  --tag-bg:rgba(66,153,225,.15); --link-bg:rgba(66,153,225,.20); --link-text:#2c6fa8;
}
[data-theme="glass"] body{
  background:
    radial-gradient(circle at 20% 30%, #ffffff 0%, transparent 40%),
    radial-gradient(circle at 80% 70%, #b8d4e3 0%, transparent 50%),
    radial-gradient(circle at 50% 50%, #f0f4f8 0%, transparent 60%),
    linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
  background-size:150% 150%;
  animation:glassBG 20s ease-in-out infinite alternate;
  background-attachment:fixed;
}
@keyframes glassBG{ 0%{background-position:0% 0%} 100%{background-position:100% 100%} }

*,*::before,*::after{ box-sizing:border-box; }
[hidden]{ display:none !important; }
html,body{ margin:0; padding:0; height:100%; }
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  background:var(--bg); color:var(--text);
  -webkit-font-smoothing:antialiased; overflow:hidden; overscroll-behavior:none;
  transition:background .25s var(--ease), color .25s var(--ease);
}
button{ font:inherit; color:inherit; background:none; border:none; cursor:pointer; }
input, textarea{ font:inherit; }

#app{ position:fixed; inset:0; display:flex; flex-direction:column; }
.view{ position:absolute; inset:0; display:none; flex-direction:column; }
.view.active{ display:flex; }

/* Header */
#view-library{ background:var(--bg); }
.lib-header{
  flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:16px 20px 14px;
  border-bottom:1px solid var(--border); background:var(--bg);
}
[data-theme="glass"] .lib-header,
[data-theme="glass"] .editor-header,
[data-theme="glass"] .editor-footer{
  background:rgba(255,255,255,0.15);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
  border-color:rgba(255,255,255,0.7);
  box-shadow:0 4px 20px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.6);
}
.brand{ display:flex; align-items:center; gap:12px; min-width:0; }
.brand-mark{
  width:40px; height:40px; border-radius:12px; flex:0 0 auto;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center; font-size:18px;
}
[data-theme="glass"] .brand-mark{
  background:#4299e1; color:#fff;
  box-shadow:0 4px 16px rgba(66,153,225,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
}
.brand h1{ font-size:18px; margin:0; letter-spacing:.3px; }
.brand p{ margin:1px 0 0; font-size:12px; color:var(--text-dim); }
.header-actions{ display:flex; align-items:center; gap:6px; flex:0 0 auto; }
.icon-btn{
  width:42px; height:42px; border-radius:12px;
  display:grid; place-items:center; font-size:17px; line-height:1;
  color:var(--text); flex:0 0 auto;
  transition:background .15s, transform .1s;
}
.icon-btn:hover{ background:var(--surface-2); }
.icon-btn:active{ transform:scale(.93); }
.icon-btn:disabled{ opacity:.35; pointer-events:none; }
.btn-primary{
  display:inline-flex; align-items:center; gap:8px;
  height:42px; padding:0 18px; border-radius:12px;
  background:var(--accent); color:var(--on-accent);
  font-weight:600; font-size:14px;
  transition:transform .12s var(--ease), filter .15s;
  position:relative;
}
.btn-primary:hover{ filter:brightness(1.08); }
.btn-primary:active{ transform:scale(.97); }
[data-theme="glass"] .btn-primary{
  background:#4299e1; color:#fff;
  box-shadow:0 4px 16px rgba(66,153,225,0.35), inset 0 1px 0 rgba(255,255,255,0.35);
}

/* Search */
.search-bar{
  display:flex; align-items:center; gap:8px;
  padding:0 20px; border-bottom:1px solid var(--border);
  background:var(--bg); flex:0 0 auto;
  max-height:0; overflow:hidden;
  transition:max-height .3s var(--ease), padding .3s var(--ease), border-color .3s var(--ease);
  border-bottom-color:transparent;
}
.search-bar.open{ max-height:64px; padding:10px 20px; border-bottom-color:var(--border); }
.search-bar input{
  flex:1; height:40px; padding:0 14px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface);
  color:var(--text); font-size:15px; outline:none; min-width:0;
}
.search-bar input:focus{ border-color:var(--accent-2); }
.search-bar button{
  height:40px; padding:0 14px; border-radius:12px;
  font-size:14px; font-weight:600; color:var(--text);
}
.search-bar button:hover{ background:var(--surface-2); }

/* Scroll */
.lib-scroll{ flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch; padding:16px 20px 90px; }

/* Filters */
.filters-bar{ display:flex; align-items:center; gap:8px; max-width:1100px; margin:0 auto 14px; }
.chips-scroll{
  flex:1; min-width:0; display:flex; gap:6px;
  overflow-x:auto; overflow-y:hidden;
  scrollbar-width:none; -webkit-overflow-scrolling:touch; padding:2px 0;
}
.chips-scroll::-webkit-scrollbar{ display:none; }
.chip{
  flex:0 0 auto; height:34px; padding:0 14px; border-radius:17px;
  font-size:13px; font-weight:600; color:var(--text-dim);
  background:var(--surface); border:1px solid var(--border);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
  transition:background .15s, color .15s, border-color .15s;
  user-select:none;
}
.chip:hover{ color:var(--text); border-color:var(--accent-2); }
.chip.active{ background:var(--accent); color:var(--on-accent); border-color:var(--accent); }
[data-theme="glass"] .chip{
  background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.7);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
}
[data-theme="glass"] .chip.active{
  background:#4299e1; color:#fff; border-color:rgba(255,255,255,0.7);
}
.chip .count{ font-size:11px; opacity:.7; font-weight:700; }
.chip.add{ border-style:dashed; }
.chip.add:hover{ background:var(--surface-2); }
.chip.tags-chip .dot{ width:6px; height:6px; border-radius:50%; background:#ff9800; }

.sort-btn{
  flex:0 0 auto; height:34px; padding:0 12px; border-radius:10px;
  font-size:12.5px; font-weight:600; color:var(--text);
  background:var(--surface); border:1px solid var(--border);
  display:inline-flex; align-items:center; gap:6px; white-space:nowrap;
}
.sort-btn:hover{ border-color:var(--accent-2); background:var(--surface-2); }
[data-theme="glass"] .sort-btn{
  background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.7);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
}

/* Notes grid */
.notes-grid{
  max-width:1100px; margin:0 auto;
  display:grid; gap:12px;
  grid-template-columns:repeat(auto-fill, minmax(220px, 1fr));
}
.notes-grid.list{ grid-template-columns:1fr; gap:8px; }
.notes-grid.list .note{ min-height:auto; padding:12px 16px; }
.notes-grid.list .note-preview{ -webkit-line-clamp:1; margin:2px 0; }

.note{
  position:relative; border-radius:var(--radius);
  background:var(--surface); border:1px solid var(--border);
  padding:14px 16px 12px; cursor:pointer;
  display:flex; flex-direction:column; gap:6px;
  min-height:110px;
  transition:transform .15s var(--ease), box-shadow .2s var(--ease), border-color .15s;
  overflow:hidden; user-select:none; -webkit-user-select:none;
}
.note:hover{ border-color:var(--accent-2); box-shadow:var(--shadow); transform:translateY(-1px); }
.note:active{ transform:scale(.995); }
[data-theme="glass"] .note{
  background:rgba(255,255,255,0.18); border:1px solid rgba(255,255,255,0.7);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
  box-shadow:0 4px 20px rgba(0,0,0,0.06), inset 0 1px 0 rgba(255,255,255,0.6);
}
[data-theme="glass"] .note:hover{
  border-color:rgba(255,255,255,0.95);
  box-shadow:0 8px 28px rgba(0,0,0,0.10), inset 0 1px 0 rgba(255,255,255,0.9);
}
.note[data-color="yellow"]{ background:var(--note-yellow); border-color:transparent; }
.note[data-color="blue"]{ background:var(--note-blue); border-color:transparent; }
.note[data-color="green"]{ background:var(--note-green); border-color:transparent; }
.note[data-color="pink"]{ background:var(--note-pink); border-color:transparent; }
.note[data-color="purple"]{ background:var(--note-purple); border-color:transparent; }
.note[data-color="orange"]{ background:var(--note-orange); border-color:transparent; }
.note[data-color="gray"]{ background:var(--note-gray); border-color:transparent; }
.note.selected{ border-color:var(--accent) !important; }

.note-pin{
  position:absolute; top:8px; right:8px;
  width:26px; height:26px; border-radius:8px;
  display:grid; place-items:center;
  font-size:13px; padding:0;
  background:transparent; color:var(--text);
  opacity:0; pointer-events:none;
  transition:opacity .15s, background .12s, transform .1s;
  z-index:2; border:none; cursor:pointer;
}
.note:hover .note-pin{ opacity:.55; pointer-events:auto; }
.note .note-pin.pinned{
  opacity:1; pointer-events:auto;
  filter:drop-shadow(0 1px 2px rgba(0,0,0,.25));
}
.note .note-pin:hover{ opacity:1 !important; background:rgba(0,0,0,.08); }
.note .note-pin:active{ transform:scale(.9); }
[data-theme="dark"] .note .note-pin:hover{ background:rgba(255,255,255,.1); }
@media (hover:none){ .note .note-pin{ opacity:.6; pointer-events:auto; } }
body.selection-mode .note-pin{ display:none !important; }

.note-title{
  font-size:15px; font-weight:700; line-height:1.3;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  padding-right:26px;
}
.note-preview{
  font-size:12.5px; line-height:1.45; color:var(--text-dim);
  display:-webkit-box; -webkit-line-clamp:3; -webkit-box-orient:vertical;
  overflow:hidden; flex:1; word-break:break-word;
}
.note-tags{
  display:flex; gap:4px; flex-wrap:wrap;
  margin-top:2px;
}
.note-tag{
  font-size:10.5px; font-weight:600;
  padding:2px 6px; border-radius:5px;
  background:var(--tag-bg); color:var(--text-dim);
}

.note-progress{
  display:flex; align-items:center; gap:6px;
  margin-top:4px;
}
.note-progress .np-bar{
  flex:1; height:3px; border-radius:2px;
  background:var(--tag-bg); overflow:hidden;
}
.note-progress .np-fill{
  height:100%; background:#4caf50; border-radius:2px;
  transition:width .25s;
}
.note-progress .np-text{
  font-size:10.5px; color:var(--text-dim); font-weight:600;
  font-variant-numeric:tabular-nums;
  min-width:30px; text-align:right;
}

.note-meta{
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
  font-size:11px; color:var(--text-dim);
  margin-top:auto; padding-top:4px;
}
.note-meta .badge{
  font-size:10px; font-weight:700; letter-spacing:.4px;
  padding:2px 6px; border-radius:5px;
  background:rgba(0,0,0,.08); text-transform:uppercase;
}
[data-theme="dark"] .note-meta .badge{ background:rgba(255,255,255,.1); }
.note-meta .badge.checklist{ color:#4caf50; }
.note-meta .badge.voice{ color:#e91e63; }
.note-meta .badge.image{ color:#2196f3; }
.note-meta .badge.daily{ color:#ff9800; }
.note-meta .folder-tag{
  font-size:10px; font-weight:600;
  padding:2px 6px; border-radius:5px;
  background:rgba(0,0,0,.08);
  max-width:90px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
[data-theme="dark"] .note-meta .folder-tag{ background:rgba(255,255,255,.1); }

.note-check-item{
  display:flex; align-items:center; gap:6px;
  font-size:12.5px; color:var(--text-dim);
}
.note-check-item.done{ text-decoration:line-through; opacity:.6; }
.note-check-item .box{
  width:11px; height:11px; border:1.5px solid currentColor; border-radius:3px; flex:0 0 auto;
}
.note-check-item.done .box{ background:currentColor; }

body.selection-mode .note{ padding-left:44px; }
.note .select-indicator{
  position:absolute; top:50%; left:14px; transform:translateY(-50%);
  width:20px; height:20px; border-radius:50%;
  border:2px solid var(--border); background:transparent;
  display:none; place-items:center;
  font-size:11px; font-weight:700; line-height:1;
  color:transparent;
}
body.selection-mode .note .select-indicator{ display:grid; }
.note.selected .select-indicator{
  background:var(--accent); border-color:var(--accent); color:var(--on-accent);
}
.note.selected .select-indicator::after{ content:"✓"; }
body.selection-mode #lib-brand > div:last-child{ display:none; }
body.selection-mode #lib-brand::after{
  content: attr(data-selected-count) " выбрано";
  font-size:16px; font-weight:700;
}

.empty{
  max-width:440px; margin:24px auto 0; text-align:center;
  padding:32px 20px; border:1px dashed var(--border); border-radius:var(--radius);
}
.empty svg{ opacity:.35; margin:0 auto 12px; display:block; }
.empty h2{ margin:0 0 8px; font-size:17px; }
.empty p{ margin:0; font-size:13.5px; color:var(--text-dim); line-height:1.5; }
.empty .btn-primary{ margin-top:18px; }

/* Editor */
#view-editor{ background:var(--bg); }
.editor-header{
  flex:0 0 auto; display:flex; align-items:center; gap:6px;
  padding:8px 10px; background:var(--bg-2); border-bottom:1px solid var(--border);
}
.editor-header-actions{ display:flex; gap:4px; margin-left:auto; }
.editor-scroll{
  flex:1; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:16px 20px 100px;
  max-width:var(--editor-w); margin:0 auto; width:100%;
  transition: background .3s var(--ease);
  position:relative;
}
.editor-title{
  width:100%; border:none; background:transparent; color:var(--text);
  font-size:22px; font-weight:700; line-height:1.3;
  padding:0 0 8px; outline:none;
}
.editor-title::placeholder{ color:var(--text-dim); opacity:.6; }
.editor-content{
  min-height:200px; outline:none;
  font-size:16px; line-height:1.6; color:var(--text);
  padding-top:4px; word-break:break-word;
  position:relative;
}
.editor-content[data-empty="true"]::before{
  content:attr(data-placeholder);
  color:var(--text-dim); opacity:.5;
  position:absolute; pointer-events:none; left:0; top:4px;
}
.editor-content h1{ font-size:1.6em; margin:.6em 0 .3em; font-weight:700; }
.editor-content h2{ font-size:1.35em; margin:.6em 0 .3em; font-weight:700; }
.editor-content h3{ font-size:1.15em; margin:.5em 0 .25em; font-weight:700; }
.editor-content blockquote{
  margin:.5em 0; padding:.25em 0 .25em 14px;
  border-left:3px solid var(--accent-2);
  color:var(--text-dim); font-style:italic;
}
.editor-content pre{
  background:var(--surface-2); border:1px solid var(--border);
  border-radius:8px; padding:10px 14px; margin:.5em 0;
  font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  font-size:.92em; overflow-x:auto; white-space:pre-wrap; word-wrap:break-word;
}
.editor-content code{ font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace; font-size:.92em; }
.editor-content .wikilink{
  color:var(--link-text); background:var(--link-bg);
  padding:1px 6px; border-radius:5px;
  cursor:pointer; font-weight:600;
  transition:background .15s;
}
.editor-content .wikilink:hover{ background:var(--link-bg); filter:brightness(.9); }
.editor-content .hashtag{
  color:var(--link-text); background:var(--tag-bg);
  padding:0 3px; border-radius:4px;
  font-weight:600; font-size:.95em;
}
.editor-content a{ color:var(--link-text); text-decoration:underline; }
.editor-content b, .editor-content strong{ font-weight:700; }
.editor-content i, .editor-content em{ font-style:italic; }
.editor-content u{ text-decoration:underline; }
.editor-content s, .editor-content strike{ text-decoration:line-through; }
.editor-content ul, .editor-content ol{ padding-left:22px; margin:6px 0; }

#editor-content.drag-over{
  background:var(--link-bg); border-radius:12px;
  outline:2px dashed var(--accent-2); outline-offset:4px;
}

/* Image wrap */
.img-wrap{
  display:inline-block; position:relative;
  max-width:100%; margin:6px 0; user-select:none;
}
.img-wrap img{
  max-width:100%; height:auto; border-radius:8px;
  display:block; cursor:zoom-in;
}
.img-wrap .img-del{
  position:absolute; top:6px; right:6px;
  width:26px; height:26px; border-radius:50%;
  background:rgba(0,0,0,.55); color:#fff;
  font-size:13px; font-weight:700;
  display:grid; place-items:center;
  opacity:0; transition:opacity .15s; cursor:pointer;
}
.img-wrap:hover .img-del{ opacity:1; }
@media (hover:none){ .img-wrap .img-del{ opacity:1; } }

.lightbox{
  position:fixed; inset:0; z-index:80;
  background:rgba(0,0,0,.85);
  display:none; align-items:center; justify-content:center;
  padding:20px; cursor:zoom-out;
}
.lightbox.show{ display:flex; }
.lightbox img{
  max-width:100%; max-height:100%;
  border-radius:6px; box-shadow:0 20px 60px rgba(0,0,0,.6);
}

.voice-note{
  display:inline-flex; align-items:center; gap:10px;
  padding:8px 14px; margin:6px 0;
  border-radius:12px;
  background:rgba(0,0,0,.06);
  border:1px solid var(--border); user-select:none;
}
[data-theme="dark"] .voice-note{ background:rgba(255,255,255,.06); }
[data-theme="glass"] .voice-note{ background:rgba(255,255,255,.3); }
.voice-note .vn-play{
  width:32px; height:32px; border-radius:50%;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center; font-size:12px;
  flex:0 0 auto; cursor:pointer; border:none;
}
[data-theme="glass"] .voice-note .vn-play{ background:#4299e1; color:#fff; }
.voice-note .vn-info{ display:flex; flex-direction:column; gap:2px; }
.voice-note .vn-time{ font-size:12px; font-weight:600; color:var(--text); }
.voice-note .vn-label{ font-size:10px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.4px; }

/* Recording bar */
.recording-bar{
  display:flex; align-items:center; gap:10px;
  margin:8px 0 0; padding:10px 14px; border-radius:12px;
  background:rgba(233,30,99,.12);
  border:1px solid rgba(233,30,99,.35);
  animation:recPulse 1.6s ease-in-out infinite;
}
@keyframes recPulse{
  0%,100%{ background:rgba(233,30,99,.12); }
  50%{ background:rgba(233,30,99,.20); }
}
.recording-bar .rec-dot{
  width:10px; height:10px; border-radius:50%; background:#e91e63;
  flex:0 0 auto; animation:blink 1s infinite;
}
@keyframes blink{ 50%{ opacity:.3; } }
.recording-bar .rec-time{
  font-size:13px; font-weight:700; color:#e91e63;
  min-width:42px; font-variant-numeric:tabular-nums;
}
.recording-bar .rec-spacer{ flex:1; }
.recording-bar button{
  height:32px; padding:0 12px; border-radius:8px;
  font-size:13px; font-weight:600;
  background:rgba(255,255,255,.5); color:#e91e63;
  border:1px solid rgba(233,30,99,.35);
}
[data-theme="dark"] .recording-bar button{ background:rgba(255,255,255,.1); }
.recording-bar button.stop{ background:#e91e63; color:#fff; border-color:#e91e63; }
.recording-bar button.cancel{ background:transparent; border-color:transparent; color:var(--text-dim); }

/* Voice input bar */
.voice-input-bar{
  display:flex; align-items:center; gap:10px;
  margin:8px 0 0; padding:10px 14px; border-radius:12px;
  background:rgba(66,153,225,.12);
  border:1px solid rgba(66,153,225,.35);
  animation:voicePulse 1.6s ease-in-out infinite;
}
@keyframes voicePulse{
  0%,100%{ background:rgba(66,153,225,.12); }
  50%{ background:rgba(66,153,225,.20); }
}
.voice-input-bar .voice-dot{
  width:10px; height:10px; border-radius:50%; background:#4299e1;
  flex:0 0 auto; animation:blink 1s infinite;
}
.voice-input-bar .voice-status{
  font-size:13px; font-weight:600; color:#4299e1; flex:1;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.voice-input-bar button{
  height:32px; padding:0 12px; border-radius:8px;
  font-size:13px; font-weight:600;
  background:rgba(255,255,255,.5); color:#4299e1;
  border:1px solid rgba(66,153,225,.35);
}
[data-theme="dark"] .voice-input-bar button{ background:rgba(255,255,255,.1); }

/* Checklist */
.checklist-wrap{ display:flex; flex-direction:column; gap:4px; --content-fs:16px; }
.check-item{
  display:flex; align-items:flex-start; gap:8px;
  padding:6px 0; position:relative;
  transition:background .15s, opacity .15s;
}
.check-item.dragging{ opacity:.4; }
.check-item.drag-over{ background:var(--surface-2); border-radius:8px; }
.check-item .drag-handle{
  width:20px; height:24px; display:grid; place-items:center;
  color:var(--text-dim); cursor:grab;
  opacity:0; flex:0 0 auto;
  font-size:12px; user-select:none;
  margin-top:1px;
}
.check-item .drag-handle:active{ cursor:grabbing; }
.check-item:hover .drag-handle{ opacity:.5; }
@media (hover:none){ .check-item .drag-handle{ opacity:.5; } }
.check-item .cb{
  width:22px; height:22px; border-radius:5px;
  border:1.5px solid var(--border); background:transparent;
  display:grid; place-items:center; flex:0 0 auto;
  cursor:pointer; margin-top:1px; padding:0;
  transition:background .15s, border-color .15s, transform .1s;
  color:var(--on-accent);
}
.check-item .cb:active{ transform:scale(.85); }
.check-item .cb svg{
  width:13px; height:13px; opacity:0;
  transition:opacity .15s, transform .2s var(--ease);
  transform:scale(.5);
}
.check-item.done .cb{ background:var(--accent); border-color:var(--accent); }
.check-item.done .cb svg{ opacity:1; transform:scale(1); }
.check-item .ctext{
  flex:1; font-size:var(--content-fs, 16px); line-height:1.5;
  outline:none; min-height:24px; padding:0;
  word-break:break-word;
}
.check-item.done .ctext{ text-decoration:line-through; color:var(--text-dim); }
.check-item .del{
  width:24px; height:24px; border-radius:6px; padding:0;
  display:grid; place-items:center; font-size:13px;
  color:var(--text-dim); opacity:0;
  transition:opacity .12s, background .12s; cursor:pointer;
}
.check-item:hover .del{ opacity:1; }
.check-item .del:hover{ background:var(--surface-2); color:var(--text); }
@media (hover:none){ .check-item .del{ opacity:.6; } }

.clear-done-btn{
  display:flex; align-items:center; gap:8px;
  margin-top:10px; padding:8px 14px;
  border-radius:10px; font-size:13px; font-weight:600;
  background:var(--surface-2); color:var(--text-dim);
  border:1px dashed var(--border);
  transition:all .15s;
}
.clear-done-btn:hover{ color:var(--text); border-color:var(--accent-2); border-style:solid; }
.clear-done-btn svg{ width:14px; height:14px; flex:0 0 auto; }

/* Scroll to top */
.scroll-top{
  position:absolute; right:16px; bottom:16px;
  width:40px; height:40px; border-radius:50%;
  background:var(--accent); color:var(--on-accent);
  display:grid; place-items:center;
  box-shadow:0 4px 16px rgba(0,0,0,.2);
  z-index:5; opacity:0; pointer-events:none;
  transition:opacity .2s, transform .2s;
  font-size:18px;
}
.scroll-top.show{ opacity:1; pointer-events:auto; }

/* Backlinks panel */
.backlinks{
  margin-top:24px; padding-top:16px;
  border-top:1px solid var(--border);
}
.backlinks-title{
  font-size:11px; font-weight:700; letter-spacing:.8px;
  text-transform:uppercase; color:var(--text-dim);
  margin-bottom:8px;
  display:flex; align-items:center; gap:8px;
}
.backlinks-count{
  background:var(--surface-2); padding:1px 7px; border-radius:5px;
  font-size:10px;
}
.backlinks-list{
  display:flex; flex-direction:column; gap:4px;
}
.backlink{
  display:flex; align-items:center; gap:10px;
  padding:8px 12px; border-radius:8px;
  background:var(--surface); border:1px solid var(--border);
  cursor:pointer; transition:all .15s;
  text-align:left;
}
.backlink:hover{ border-color:var(--accent-2); background:var(--surface-2); }
.backlink-title{ font-size:13px; font-weight:600; color:var(--text); flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.backlink-arrow{ color:var(--text-dim); font-size:14px; }

/* Editor footer */
.editor-footer{
  flex:0 0 auto;
  background:var(--bg-2); border-top:1px solid var(--border);
  padding:8px 10px calc(8px + env(safe-area-inset-bottom));
}
.format-bar{
  display:flex; gap:2px; padding:0 4px 8px;
  border-bottom:1px solid var(--border); margin-bottom:8px;
  overflow-x:auto; scrollbar-width:none;
}
.format-bar::-webkit-scrollbar{ display:none; }
.format-bar button{
  min-width:36px; height:36px; padding:0 10px;
  border-radius:8px; font-size:14px; font-weight:700;
  color:var(--text); transition:background .12s; flex:0 0 auto;
}
.format-bar button:hover{ background:var(--surface-2); }
.format-bar button.active{ background:var(--accent); color:var(--on-accent); }
.format-bar button:disabled{ opacity:.3; pointer-events:none; }
[data-theme="glass"] .format-bar button.active{ background:#4299e1; color:#fff; }
.format-bar .divider{ width:1px; background:var(--border); margin:0 4px; flex:0 0 auto; align-self:stretch; }
.format-bar .fs-hint{
  display:inline-flex; align-items:center;
  font-size:11px; color:var(--text-dim);
  min-width:28px; justify-content:center;
  font-variant-numeric:tabular-nums;
}

.editor-toolbar{
  display:flex; align-items:center; gap:2px;
  padding:0 4px; justify-content:space-around; overflow-x:auto;
  scrollbar-width:none;
}
.editor-toolbar::-webkit-scrollbar{ display:none; }
.editor-toolbar button{
  width:42px; height:42px; border-radius:10px;
  display:grid; place-items:center; flex:0 0 auto;
  font-size:18px; color:var(--text);
  transition:background .12s, transform .1s;
}
.editor-toolbar button:hover{ background:var(--surface-2); }
.editor-toolbar button:active{ transform:scale(.92); }
.editor-toolbar button.active{ background:var(--accent); color:var(--on-accent); }
[data-theme="glass"] .editor-toolbar button.active{ background:#4299e1; color:#fff; }

.editor-status{
  display:flex; justify-content:space-between;
  font-size:11px; color:var(--text-dim);
  padding:6px 6px 0;
  font-variant-numeric:tabular-nums;
}
.editor-status .progress-inline{
  display:flex; align-items:center; gap:6px;
}
.editor-status .progress-bar{
  width:60px; height:4px; border-radius:2px;
  background:var(--border); overflow:hidden;
}
.editor-status .progress-fill{
  height:100%; background:var(--accent); width:0%; transition:width .3s;
}

/* Focus mode */
body.focus-mode .editor-header,
body.focus-mode .editor-footer,
body.focus-mode .backlinks{ display:none !important; }
body.focus-mode .editor-scroll{ padding:40px 20px; }

/* Slash menu */
.slash-menu{
  position:absolute; z-index:60;
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.2);
  padding:4px; min-width:220px; max-height:280px; overflow-y:auto;
  animation:menuIn .12s var(--ease);
}
[data-theme="glass"] .slash-menu{
  background:rgba(255,255,255,0.55); backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px); border-color:rgba(255,255,255,0.9);
}
.slash-menu button{
  display:flex; align-items:center; gap:10px;
  width:100%; padding:8px 12px; border-radius:7px;
  font-size:13px; text-align:left; color:var(--text);
}
.slash-menu button:hover, .slash-menu button.active{ background:var(--surface-2); }
.slash-menu button .sm-icon{
  width:24px; height:24px; display:grid; place-items:center;
  background:var(--surface-2); border-radius:6px;
  font-size:12px; color:var(--text-dim); flex:0 0 auto;
}
.slash-menu button .sm-label{ flex:1; font-weight:600; }
.slash-menu button .sm-hint{ font-size:10px; color:var(--text-dim); }

/* Wiki autocomplete menu */
.wiki-menu{
  position:fixed; z-index:60; min-width:240px; max-width:340px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.2);
  padding:4px; max-height:280px; overflow-y:auto;
  animation:menuIn .12s var(--ease);
}
[data-theme="glass"] .wiki-menu{
  background:rgba(255,255,255,0.55);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
  border-color:rgba(255,255,255,0.9);
}
.wiki-menu button{
  display:flex; align-items:center; gap:10px;
  width:100%; padding:8px 12px; border-radius:7px;
  font-size:13px; text-align:left; color:var(--text);
}
.wiki-menu button:hover, .wiki-menu button.active{ background:var(--surface-2); }
.wiki-menu button .wm-title{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
.wiki-menu button .wm-meta{ font-size:10px; color:var(--text-dim); flex:0 0 auto; }
.wiki-menu .wm-empty{ padding:14px; font-size:13px; color:var(--text-dim); text-align:center; }

/* Overlays */
.overlay{
  position:fixed; inset:0; z-index:30;
  background:var(--overlay); opacity:0; pointer-events:none;
  transition:opacity .25s var(--ease);
}
.overlay.show{ opacity:1; pointer-events:auto; }
[data-theme="glass"] .overlay{ backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }

.sheet{
  position:fixed; bottom:0; left:0; right:0; z-index:40;
  background:var(--surface); border-top-left-radius:20px; border-top-right-radius:20px;
  box-shadow:0 -8px 32px rgba(0,0,0,.18);
  transform:translateY(100%);
  transition:transform .3s var(--ease);
  max-height:88vh; display:flex; flex-direction:column;
  padding-bottom:env(safe-area-inset-bottom);
  margin:0 auto; max-width:640px;
}
.sheet.open{ transform:translateY(0); }
[data-theme="glass"] .sheet{
  background:rgba(255,255,255,0.35); backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px); border:1px solid rgba(255,255,255,0.7);
  border-bottom:none;
}
.sheet-handle{
  width:36px; height:4px; border-radius:2px;
  background:var(--border); margin:10px auto 4px; flex:0 0 auto;
}
.sheet-body{ padding:8px 12px 16px; overflow-y:auto; }
.sheet-title{
  font-size:12px; font-weight:700; text-transform:uppercase; letter-spacing:.6px;
  color:var(--text-dim); padding:8px 12px 4px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.sheet-action{
  display:flex; align-items:center; gap:14px;
  width:100%; padding:14px 12px; border-radius:10px;
  font-size:15px; text-align:left;
  transition:background .12s;
}
.sheet-action:hover{ background:var(--surface-2); }
.sheet-action .icon{
  width:22px; height:22px; display:grid; place-items:center;
  font-size:17px; color:var(--text-dim); flex:0 0 auto;
}
.sheet-action.danger{ color:#c94a4a; }
.sheet-action.danger .icon{ color:#c94a4a; }
.sheet-action.danger:hover{ background:rgba(201,74,74,.08); }
.sheet-divider{ height:1px; background:var(--border); margin:4px 12px; }
.sheet-action .action-meta{
  font-size:11px; color:var(--text-dim); margin-left:auto;
  font-weight:500;
}

.color-grid{
  display:grid; grid-template-columns:repeat(4, 1fr); gap:12px;
  padding:12px;
}
.color-swatch{
  aspect-ratio:1; border-radius:12px;
  border:2px solid transparent;
  display:grid; place-items:center;
  font-size:18px; font-weight:700; color:var(--text);
  background:var(--surface-2);
  cursor:pointer; transition:transform .12s, border-color .15s;
}
.color-swatch:hover{ transform:scale(1.05); }
.color-swatch.active{ border-color:var(--accent); box-shadow:0 0 0 2px var(--surface); }
.color-swatch[data-color="none"]{ background:var(--surface-2); }
.color-swatch[data-color="yellow"]{ background:var(--note-yellow); }
.color-swatch[data-color="blue"]{ background:var(--note-blue); }
.color-swatch[data-color="green"]{ background:var(--note-green); }
.color-swatch[data-color="pink"]{ background:var(--note-pink); }
.color-swatch[data-color="purple"]{ background:var(--note-purple); }
.color-swatch[data-color="orange"]{ background:var(--note-orange); }
.color-swatch[data-color="gray"]{ background:var(--note-gray); }

.modal{
  position:fixed; inset:0; z-index:50; display:none;
  align-items:center; justify-content:center;
  background:var(--overlay); padding:20px;
}
.modal.show{ display:flex; }
[data-theme="glass"] .modal{ backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.modal-box{
  width:min(380px, 100%);
  background:var(--surface); border:1px solid var(--border);
  border-radius:18px; padding:20px; box-shadow:var(--shadow);
  animation:modalIn .2s var(--ease);
}
@keyframes modalIn{ from{ transform:scale(.95); opacity:0; } to{ transform:scale(1); opacity:1; } }
[data-theme="glass"] .modal-box{
  background:rgba(255,255,255,0.30); backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px); border:1px solid rgba(255,255,255,0.7);
}
.modal-box h3{ margin:0 0 14px; font-size:16px; }
.modal-box p{ margin:0 0 6px; font-size:14px; color:var(--text-dim); line-height:1.5; }
.modal-box input{
  width:100%; height:46px; padding:0 14px;
  border-radius:12px; border:1px solid var(--border);
  background:var(--bg); color:var(--text); font-size:15px; outline:none;
}
.modal-box input:focus{ border-color:var(--accent-2); }
.modal-actions{ display:flex; gap:8px; margin-top:14px; }
.modal-actions button{
  flex:1; height:44px; border-radius:12px;
  border:1px solid var(--border); background:var(--surface-2);
  font-size:14px; font-weight:600;
}
.modal-actions button.primary{
  background:var(--accent); color:var(--on-accent); border-color:transparent;
}
[data-theme="glass"] .modal-actions button.primary{ background:#4299e1; color:#fff; }
.modal-actions button.danger{
  background:rgba(201,74,74,.12); color:#c94a4a;
  border-color:rgba(201,74,74,.3); flex:0 0 auto; padding:0 14px;
}

/* Palette */
.palette{
  position:fixed; inset:0; z-index:70;
  background:var(--overlay); padding:60px 20px 20px;
  display:none; align-items:flex-start; justify-content:center;
}
.palette.show{ display:flex; }
[data-theme="glass"] .palette{ backdrop-filter:blur(6px); -webkit-backdrop-filter:blur(6px); }
.palette-box{
  width:min(560px, 100%);
  background:var(--surface); border:1px solid var(--border);
  border-radius:16px; box-shadow:0 20px 60px rgba(0,0,0,.3);
  overflow:hidden; animation:modalIn .18s var(--ease);
  display:flex; flex-direction:column; max-height:70vh;
}
[data-theme="glass"] .palette-box{
  background:rgba(255,255,255,0.5); backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px); border-color:rgba(255,255,255,0.9);
}
.palette-input{
  width:100%; height:52px; padding:0 20px;
  border:none; background:transparent; color:var(--text);
  font-size:16px; outline:none;
  border-bottom:1px solid var(--border);
}
.palette-list{ overflow-y:auto; padding:6px; }
.palette-item{
  display:flex; align-items:center; gap:12px;
  width:100%; padding:10px 14px; border-radius:8px;
  font-size:14px; text-align:left; color:var(--text);
  cursor:pointer; transition:background .1s;
}
.palette-item.active, .palette-item:hover{ background:var(--surface-2); }
.palette-item .pi-icon{
  width:26px; height:26px; display:grid; place-items:center;
  background:var(--surface-2); border-radius:6px;
  font-size:13px; flex:0 0 auto; color:var(--text-dim);
}
.palette-item .pi-label{ flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.palette-item .pi-hint{ font-size:11px; color:var(--text-dim); }
.palette-empty{
  padding:24px; text-align:center; color:var(--text-dim); font-size:13px;
}

/* Settings sheet */
.settings-group{
  padding:12px; border-bottom:1px solid var(--border);
}
.settings-group:last-child{ border-bottom:none; }
.settings-group h4{
  margin:0 0 10px; font-size:11px; font-weight:700;
  text-transform:uppercase; letter-spacing:.8px;
  color:var(--text-dim);
}
.settings-row{
  display:flex; align-items:center; justify-content:space-between;
  gap:12px; padding:8px 0; font-size:14px;
}
.settings-row .setting-label{ flex:1; min-width:0; }
.settings-row .setting-label small{ display:block; font-size:11px; color:var(--text-dim); margin-top:2px; }
.segmented{
  display:flex; background:var(--surface-2); border-radius:8px;
  padding:2px; gap:2px;
}
.segmented button{
  padding:6px 12px; border-radius:6px;
  font-size:12px; font-weight:600; color:var(--text-dim);
  transition:all .12s;
}
.segmented button.active{
  background:var(--surface); color:var(--text);
  box-shadow:0 1px 3px rgba(0,0,0,.1);
}
.settings-number{
  width:70px; height:36px; padding:0 10px; text-align:center;
  border-radius:8px; border:1px solid var(--border);
  background:var(--surface-2); color:var(--text);
  font-size:14px; font-weight:600; outline:none;
}
.stat-grid{
  display:grid; grid-template-columns:repeat(2, 1fr); gap:8px;
}
.stat-cell{
  padding:12px; border-radius:10px; text-align:center;
  background:var(--surface-2);
}
.stat-cell .stat-value{ font-size:22px; font-weight:800; color:var(--text); }
.stat-cell .stat-label{ font-size:11px; color:var(--text-dim); margin-top:2px; text-transform:uppercase; letter-spacing:.5px; }

/* Toast */
.toast{
  position:fixed; bottom:24px; left:50%;
  transform:translateX(-50%) translateY(20px);
  padding:12px 18px;
  background:var(--accent); color:var(--on-accent);
  border-radius:12px; font-size:14px; font-weight:600;
  box-shadow:0 8px 24px rgba(0,0,0,.25);
  opacity:0; transition:opacity .25s, transform .25s;
  z-index:100; pointer-events:none; max-width:90vw;
  display:flex; align-items:center; gap:14px;
}
[data-theme="glass"] .toast{ background:#4299e1; color:#fff; }
.toast.show{ opacity:1; transform:translateX(-50%) translateY(0); pointer-events:auto; }
.toast .toast-action{
  padding:4px 10px; border-radius:6px;
  background:rgba(255,255,255,.2); color:inherit;
  font-size:13px; font-weight:700;
  cursor:pointer; border:none;
  transition:background .15s;
}
.toast .toast-action:hover{ background:rgba(255,255,255,.35); }

/* Sort popup */
.sort-popup{
  position:fixed; z-index:60; min-width:210px;
  background:var(--surface); border:1px solid var(--border);
  border-radius:12px; box-shadow:0 12px 40px rgba(0,0,0,.15);
  padding:6px; animation:menuIn .15s var(--ease);
}
@keyframes menuIn{ from{ opacity:0; transform:translateY(-4px); } to{ opacity:1; transform:translateY(0); } }
[data-theme="glass"] .sort-popup{
  background:rgba(255,255,255,0.5);
  backdrop-filter:blur(25px); -webkit-backdrop-filter:blur(25px);
  border-color:rgba(255,255,255,0.9);
}
.sort-popup button{
  display:flex; align-items:center; justify-content:space-between;
  gap:10px; width:100%; padding:9px 12px;
  border-radius:8px; font-size:13px; color:var(--text);
  text-align:left; transition:background .12s;
}
.sort-popup button:hover{ background:var(--surface-2); }
.sort-popup button.active{ font-weight:700; }
.sort-popup button .check{ font-size:12px; color:var(--accent); opacity:0; }
.sort-popup button.active .check{ opacity:1; }

/* Selection bar */
.selection-bar{
  position:fixed; bottom:0; left:0; right:0;
  background:var(--surface); border-top:1px solid var(--border);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
  display:none; align-items:center; justify-content:space-around;
  z-index:45; box-shadow:0 -4px 20px rgba(0,0,0,.08);
}
[data-theme="glass"] .selection-bar{
  background:rgba(255,255,255,0.35); backdrop-filter:blur(25px);
  -webkit-backdrop-filter:blur(25px); border:1px solid rgba(255,255,255,0.7);
}
body.selection-mode .selection-bar{ display:flex; }
.selection-bar button{
  display:flex; flex-direction:column; align-items:center; gap:4px;
  font-size:11px; color:var(--text); padding:6px 10px; border-radius:10px;
  min-width:52px;
}
.selection-bar button:hover{ background:var(--surface-2); }
.selection-bar button .icon{ font-size:19px; line-height:1; }
.selection-bar button.danger{ color:#c94a4a; }
.selection-bar button[hidden]{ display:none; }

@media (max-width:620px){
  .lib-header{ padding:12px 14px; }
  .brand-mark{ width:36px; height:36px; border-radius:11px; font-size:16px; }
  .brand h1{ font-size:16px; }
  .brand p{ font-size:11px; }
  .lib-scroll{ padding:12px 14px 90px; }
  .btn-primary span{ display:none; }
  .btn-primary::before{ content:"＋"; font-size:19px; font-weight:400; }
  .btn-primary{ padding:0 14px; }
  .header-actions .icon-btn{ width:38px; height:38px; }
  .notes-grid{ grid-template-columns:repeat(2, 1fr); gap:8px; }
  .note{ padding:12px 12px 10px; min-height:96px; }
  .note-title{ font-size:14px; }
  .note-preview{ font-size:11.5px; -webkit-line-clamp:2; }
  .editor-scroll{ padding:12px 16px 100px; }
  .editor-title{ font-size:20px; }
  .check-item .ctext{ font-size:calc(var(--content-fs, 16px) - 1px); }
  .editor-status{ padding:4px 6px 0; flex-wrap:wrap; gap:4px; }
  .sort-btn #sort-label{ display:none; }
  .selection-bar button{ min-width:44px; padding:6px 4px; font-size:10px; }
  .selection-bar button .icon{ font-size:16px; }
}

/* Print */
@media print{
  body{ background:#fff !important; color:#000 !important; }
  .editor-header, .editor-footer, .backlinks, .scroll-top,
  .lib-header, .selection-bar, .overlay, .sheet, .modal,
  .palette, .toast, .sort-popup, .slash-menu, .lightbox, .wiki-menu,
  .recording-bar, .voice-input-bar{ display:none !important; }
  .editor-scroll{ padding:0; max-width:100%; overflow:visible; }
  .editor-content, .checklist-wrap{ color:#000 !important; }
  .check-item .cb{ border-color:#000 !important; }
  .check-item.done .cb{ background:#000 !important; }
}
