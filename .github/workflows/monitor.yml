name: Ecosystem Monitor
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Ensure alert label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "monitoring-alert" --repo "$GITHUB_REPOSITORY" \
            --description "Автоматический алерт от Ecosystem Monitor" \
            --color "ef4444" --force

      - name: Check websites and update data
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          SITES=(
            "Root|https://zloba010.github.io/|zloba010.github.io"
            "KFWR|https://zloba010.github.io/KFWR---Kizami-Free-Web-Reader/|KFWR---Kizami-Free-Web-Reader"
            "Kizamia Notes|https://zloba010.github.io/kizamianotes/|kizamianotes"
            "Upscale Image|https://zloba010.github.io/KizamiaUpscaleImage/|KizamiaUpscaleImage"
            "Kizamia Weather|https://zloba010.github.io/Kizamia-Weather/|Kizamia-Weather"
          )

          if [ -f uptime-data.json ]; then
            DATA=$(cat uptime-data.json)
          else
            DATA='{"last_updated": "", "sites": {}}'
          fi

          CURRENT_TIME=$(date -Iseconds)

          for site_info in "${SITES[@]}"; do
            IFS='|' read -r name url repo <<< "$site_info"

            START=$(date +%s%3N)
            HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 --connect-timeout 5 "$url" || echo "0")
            END=$(date +%s%3N)
            RESPONSE_TIME=$((END - START))
            if [ "$HTTP_CODE" = "000" ]; then HTTP_CODE=0; fi

            if [ "$HTTP_CODE" -ge 200 ] && [ "$HTTP_CODE" -lt 400 ]; then
              STATUS="up"
            else
              STATUS="down"
            fi
            echo "$name: $STATUS (${RESPONSE_TIME}ms, code $HTTP_CODE)"

            DATA=$(echo "$DATA" | jq --arg name "$name" --arg url "$url" --arg repo "$repo" \
                      --arg status "$STATUS" --argjson code "$HTTP_CODE" --argjson ms "$RESPONSE_TIME" --arg time "$CURRENT_TIME" '
              .last_updated = $time |
              .sites[$name] = {
                url: $url,
                repo: $repo,
                current_status: $status,
                current_code: $code,
                current_ms: $ms,
                history: ((.sites[$name].history // []) + [{time: $time, status: $status, ms: $ms, code: $code}]) | .[-288:]
              }')

            if [ "$STATUS" = "down" ]; then
              ISSUE_TITLE="🚨 Сайт недоступен: $name"
              OPEN_COUNT=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | length")
              if [ "$OPEN_COUNT" -eq 0 ]; then
                gh issue create --repo "$GITHUB_REPOSITORY" --title "$ISSUE_TITLE" \
                  --body "Сайт [$name]($url) вернул код $HTTP_CODE. Время: $CURRENT_TIME. Отклик: ${RESPONSE_TIME}мс." \
                  --label "monitoring-alert" || true
              fi
            else
              ISSUE_TITLE="🚨 Сайт недоступен: $name"
              ISSUES=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --json number,title --jq "[.[] | select(.title == \"$ISSUE_TITLE\")] | .[].number")
              for n in $ISSUES; do
                gh issue close "$n" --repo "$GITHUB_REPOSITORY" --comment "✅ Сайт $name снова доступен." || true
              done
            fi
          done

          echo "$DATA" | jq '.' > uptime-data.json

          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Monitor Bot"
          git add uptime-data.json
          if git diff --cached --quiet; then
            echo "Изменений нет."
          else
            git commit -m "chore: update uptime data"
            git pull --rebase origin main || true
            git push || (git pull --rebase origin main && git push) || true
          fi
