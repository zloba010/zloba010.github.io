/* ============ Global keyboard ============ */
document.addEventListener('keydown', (e) => {
  const mod = e.metaKey || e.ctrlKey;
  const inEditor = $('#view-editor').classList.contains('active')
    && document.activeElement
    && ($('#editor-content').contains(document.activeElement) || document.activeElement === $('#editor-content'));

  if (mod && !e.shiftKey && !e.altKey && e.key.toLowerCase() === 'k'){
    e.preventDefault();
    if ($('#palette').classList.contains('show')) closePalette();
    else openPalette();
    return;
  }
  if (mod && e.altKey && e.key.toLowerCase() === 'n'){
    e.preventDefault();
    if (!$('#palette').classList.contains('show')) createNote('text');
    return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'f'){
    e.preventDefault();
    if ($('#view-editor').classList.contains('active')) document.body.classList.toggle('focus-mode');
    return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'm' && inEditor){
    e.preventDefault();
    $('#tb-checklist').click();
    return;
  }
  if (mod && e.shiftKey && e.key.toLowerCase() === 'x' && inEditor){
    e.preventDefault();
    document.execCommand('strikeThrough');
    markEditorDirty();
    return;
  }

  if (e.key === 'Escape'){
    if ($('#lightbox').classList.contains('show')){ $('#lightbox').classList.remove('show'); return; }
    if ($('#palette').classList.contains('show')){ closePalette(); return; }
    if (wikiMenuEl){ hideWikiMenu(); return; }
    if (slashMenuEl){ hideSlashMenu(); return; }
    if ($('#confirm-modal').classList.contains('show')){ closeConfirm(); return; }
    if ($('#folder-modal').classList.contains('show')){ closeFolderModal(); return; }
    if ($('#move-modal').classList.contains('show')){ closeMoveModal(); return; }
    if ($('#sort-menu')){ closeSortMenu(); return; }
    if (document.body.classList.contains('selection-mode')){ exitSelectionMode(); return; }
    if ($('.sheet.open')){ closeSheets(); return; }
    if ($('#view-editor').classList.contains('active')) closeEditor();
  }
});

/* ============ Multi-tab sync ============ */
window.addEventListener('storage', (e) => {
  if (e.key === KEYS.folders){ folders = LS.get(KEYS.folders, []); renderLibrary(); return; }
  if (e.key === KEYS.settings){
    const fresh = LS.get(KEYS.settings, {});
    settings = Object.assign(settings, fresh);
    applyTheme(); updateViewToggleIcon(); applyFontSizeToContent(); applyEditorWidth(); applyEditorFont();
    renderLibrary(); return;
  }
  if (e.key === KEYS.notes){
    const fresh = LS.get(KEYS.notes, []);
    if (!currentNoteId){ notes = fresh; renderLibrary(); return; }
    const currentSnapshot = notes.find(n => n.id === currentNoteId);
    notes = fresh;
    const idx = notes.findIndex(n => n.id === currentNoteId);
    if (idx >= 0 && currentSnapshot) notes[idx] = currentSnapshot;
    else if (currentSnapshot) notes.push(currentSnapshot);
    renderLibrary();
  }
});

/* ============ URL param ============ */
function openFromURL(){
  const params = new URLSearchParams(location.search);
  const noteId = params.get('note');
  if (!noteId) return;
  history.replaceState({}, '', location.pathname + location.hash);
  if (notes.find(n => n.id === noteId)) openEditor(noteId);
}

/* ============ Init ============ */
function init(){
  applyTheme();
  updateViewToggleIcon();
  applyEditorWidth();
  applyEditorFont();

  notes = notes.filter(n => n && typeof n === 'object' && n.id).map(n => {
    const note = {
      ...n,
      type: n.type === 'checklist' ? 'checklist' : 'text',
      color: NOTE_COLORS.includes(n.color) ? n.color : 'none',
      pinned: !!n.pinned,
      items: Array.isArray(n.items) ? n.items.map(it => ({
        id: it && it.id || uid(),
        text: it && typeof it.text === 'string' ? it.text : '',
        done: !!(it && it.done)
      })) : [],
      html: typeof n.html === 'string' ? n.html : '',
      title: typeof n.title === 'string' ? n.title : '',
      updatedAt: n.updatedAt || n.createdAt || Date.now(),
      tags: Array.isArray(n.tags) ? n.tags : [],
      links: Array.isArray(n.links) ? n.links : [],
      isDaily: !!n.isDaily
    };
    if (!note.tags.length) note.tags = extractTags(note);
    if (!note.links.length) note.links = extractLinks(note);
    return note;
  });

  const thirtyDays = 30 * 24 * 60 * 60 * 1000;
  const now = Date.now();
  let cleaned = false;
  notes = notes.filter(n => {
    if (n.deletedAt && (now - n.deletedAt) > thirtyDays){
      if (n.html){
        const matches = n.html.matchAll(/data-att-id="([^"]+)"/g);
        for (const m of matches) idbDel('att:' + m[1]).catch(() => {});
      }
      cleaned = true;
      return false;
    }
    return true;
  });
  if (cleaned) saveNotes();

  renderLibrary();
  openFromURL();

  window.addEventListener('beforeunload', () => {
    if (currentNoteId) saveNoteNow();
  });
  document.addEventListener('visibilitychange', () => {
    if (document.hidden && currentNoteId) saveNoteNow();
  });
}

init();
</script>
</body>
</html>
