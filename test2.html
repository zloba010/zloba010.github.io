<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="yandex-verification" content="d141a4f33921e812" />
    <title>TroubleTab</title>
    <style>
        :root {
            --bg-color: #f4ebd9;
            --text-color: #3e2723;
            --primary-color: #3e2723;
            --accent-color: #ff1744;
            --panel-bg: rgba(244, 235, 217, 0.95);
            --input-bg: rgba(255, 255, 255, 0.5);
            --border-color: #3e2723;
            --glass-blur: none;
            --glass-border: 2px solid transparent;
            --shadow-color: rgba(0,0,0,0.1);
        }
        [data-theme="dark"] {
            --bg-color: #2c1e16;
            --text-color: #e6d5c3;
            --primary-color: #e6d5c3;
            --accent-color: #ffeb3b;
            --panel-bg: rgba(44, 30, 22, 0.95);
            --input-bg: rgba(0, 0, 0, 0.3);
            --border-color: #e6d5c3;
            --glass-blur: none;
            --glass-border: 2px solid transparent;
            --shadow-color: rgba(0,0,0,0.4);
        }
        [data-theme="glass"] {
            --bg-color: #e2e8f0;
            --text-color: #2d3748;
            --primary-color: #2d3748;
            --accent-color: #4299e1;
            --panel-bg: rgba(255, 255, 255, 0.15);
            --input-bg: transparent;
            --border-color: rgba(255, 255, 255, 0.9);
            --glass-blur: blur(25px);
            --glass-border: 1.5px solid rgba(255, 255, 255, 0.8);
            --shadow-color: rgba(0, 0, 0, 0.08);
        }
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            transition: background-color 0.3s, color 0.3s, border-color 0.3s, box-shadow 0.3s, opacity 0.5s ease, transform 0.5s ease;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
        }
        body.productivity-mode,
        body.radio-mode {
            overflow-x: hidden;
            overflow-y: auto;
            justify-content: flex-start;
            padding-top: 90px;
            padding-bottom: 60px;
        }
        body.only-search-mode {
            overflow: hidden;
        }
        body[data-theme="glass"] {
            background: 
                radial-gradient(circle at 20% 30%, #ffffff 0%, transparent 40%),
                radial-gradient(circle at 80% 70%, #b8d4e3 0%, transparent 50%),
                radial-gradient(circle at 50% 50%, #f0f4f8 0%, transparent 60%),
                linear-gradient(135deg, #e2e8f0 0%, #cbd5e1 100%);
            background-size: 150% 150%;
            animation: glassBG 20s ease-in-out infinite alternate;
        }
        body.productivity-mode[data-theme="glass"],
        body.radio-mode[data-theme="glass"] {
            background-attachment: fixed;
        }
        @keyframes glassBG {
            0% { background-position: 0% 0%; }
            100% { background-position: 100% 100%; }
        }
        #lightCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none; display: none;
        }
        body[data-theme="dark"] #lightCanvas { display: block; }
        #bubbleCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 1; pointer-events: auto; display: none;
        }
        body[data-theme="light"] #bubbleCanvas { display: block; }
        #dustCanvas {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 6; pointer-events: none; display: none;
        }
        body[data-theme="dark"] #dustCanvas { display: block; }

        .flashlight {
            position: fixed; width: 32px; height: 72px; z-index: 90;
            cursor: pointer; display: none; transform-origin: 50% 0%;
            transition: filter 0.3s, opacity 0.5s ease, transform 0.5s ease;
        }
        #flashlightLeft { top: -12px; left: -25px; }
        .flash-body { transition: fill 0.3s; }
        .flash-lens { fill: #1a1a1a; transition: fill 0.3s; }
        .flashlight.active .flash-lens {
            fill: #fff9c4;
            filter: drop-shadow(0 0 6px #ffeb3b) drop-shadow(0 0 14px rgba(255,235,59,0.6));
        }
        .flashlight.active { filter: drop-shadow(0 0 12px rgba(255, 235, 59, 0.55)); }
        body[data-theme="dark"] .flashlight { display: block; }

        .dynamic-island {
            position: absolute; top: 20px; left: 50%; transform: translateX(-50%);
            background-color: var(--panel-bg);
            color: var(--text-color);
            border-radius: 40px;
            padding: 12px 32px;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            cursor: pointer;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: var(--glass-border);
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: all 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            z-index: 100; min-width: 140px;
        }
        body.productivity-mode .dynamic-island,
        body.radio-mode .dynamic-island {
            position: fixed;
        }
        body[data-theme="dark"] .dynamic-island {
            border: 2px solid rgba(230, 213, 195, 0.3);
            box-shadow: 0 4px 15px var(--shadow-color);
        }
        body[data-theme="glass"] .time-display {
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: #1a202c;
        }
        .dynamic-island:hover { padding-bottom: 20px; padding-top: 16px; border-radius: 25px; }

        .weather-display {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-bottom: 0;
            white-space: nowrap;
        }
        .dynamic-island:hover .weather-display {
            opacity: 1;
            max-height: 30px;
            margin-bottom: 6px;
        }
        .weather-city { 
            opacity: 0.8; max-width: 90px; overflow: hidden; text-overflow: ellipsis; 
            cursor: pointer; border-bottom: 1px dashed transparent;
            transition: border-color 0.2s, opacity 0.2s;
        }
        .weather-city:hover {
            opacity: 1;
            border-bottom-color: var(--accent-color);
        }
        .weather-icon { font-size: 1rem; line-height: 1; }
        .weather-temp { font-weight: 800; }

        .weather-extended {
            display: grid;
            grid-template-columns: auto 1fr;
            gap: 3px 12px;
            font-size: 0.72rem;
            font-weight: 500;
            opacity: 0;
            max-height: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            margin-top: 0;
            width: 100%;
            padding: 0 4px;
            white-space: nowrap;
        }
        body.productivity-mode .dynamic-island:hover .weather-extended {
            opacity: 0.9;
            max-height: 150px;
            margin-top: 8px;
        }
        .weather-extended .wx-label { opacity: 0.6; text-align: right; }
        .weather-extended .wx-value { font-weight: 600; text-align: left; }
        .weather-extended .wx-divider {
            grid-column: 1 / -1;
            height: 1px;
            background: currentColor;
            opacity: 0.15;
            margin: 4px 0;
        }

        .time-display { font-size: 1.2rem; font-weight: 600; letter-spacing: 1px; }
        .date-display {
            font-size: 0.85rem;
            opacity: 0; max-height: 0; overflow: hidden;
            transition: all 0.3s ease; margin-top: 0;
        }
        .dynamic-island:hover .date-display { opacity: 0.8; max-height: 20px; margin-top: 4px; }
        
        .dynamic-island.is-tyk .date-display,
        .dynamic-island.is-tyk .weather-display,
        .dynamic-island.is-tyk .weather-extended { 
            opacity: 0 !important; max-height: 0 !important; margin: 0 !important;
        }

        .theme-toggle {
            position: absolute; top: 20px; right: 20px;
            background: var(--panel-bg); color: var(--text-color);
            border: var(--glass-border); border-radius: 50%;
            width: 45px; height: 45px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 4px 15px var(--shadow-color);
            font-size: 1.2rem; z-index: 100;
            user-select: none;
            -webkit-user-select: none;
            touch-action: manipulation;
        }
        body.productivity-mode .theme-toggle,
        body.radio-mode .theme-toggle,
        body.only-search-mode .theme-toggle {
            position: fixed;
        }
        .theme-toggle:hover { box-shadow: 0 0 20px var(--accent-color); border-color: var(--accent-color); }
        .theme-toggle .press-ring {
            position: absolute;
            inset: -4px;
            width: calc(100% + 8px);
            height: calc(100% + 8px);
            pointer-events: none;
            transform: rotate(-90deg);
        }
        .theme-toggle .press-ring circle {
            fill: none;
            stroke: var(--accent-color);
            stroke-width: 2.5;
            stroke-linecap: round;
            stroke-dasharray: 144.5;
            stroke-dashoffset: 144.5;
            opacity: 0;
            transition: opacity 0.15s;
        }
        .theme-toggle.pressing .press-ring circle {
            opacity: 1;
            animation: pressFill 700ms linear forwards;
        }
        @keyframes pressFill {
            from { stroke-dashoffset: 144.5; }
            to { stroke-dashoffset: 0; }
        }
        .theme-toggle.mode-active {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            box-shadow: 0 0 20px var(--accent-color);
        }

        .toast-notification {
            position: fixed;
            bottom: 30px;
            right: 30px;
            background-color: var(--panel-bg);
            color: var(--text-color);
            padding: 14px 24px;
            border-radius: 16px;
            border: var(--glass-border);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 10px 30px var(--shadow-color);
            font-size: 1rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            display: flex;
            align-items: center;
            gap: 10px;
            z-index: 2000;
            opacity: 0;
            transform: translateX(50px) scale(0.95);
            pointer-events: none;
            transition: all 0.5s cubic-bezier(0.25, 0.8, 0.25, 1);
        }
        .toast-notification.show {
            opacity: 1;
            transform: translateX(0) scale(1);
            pointer-events: auto;
        }

        .main-container {
            display: flex; flex-direction: column; align-items: center;
            width: 100%; max-width: 800px; padding: 20px;
            z-index: 10; position: relative;
        }
        .logo {
            font-size: 3.5rem; font-weight: 800; margin-bottom: 30px;
            letter-spacing: -1px; color: var(--text-color); display: flex;
        }
        body[data-theme="glass"] .logo { text-shadow: 0 4px 10px rgba(255,255,255,0.5); }
        .logo span { display: inline-block; text-shadow: 2px 2px 4px rgba(0,0,0,0.1); }

        .search-wrapper {
            width: 100%; display: flex; align-items: center;
            background: var(--input-bg);
            border: var(--glass-border);
            border-radius: 40px; padding: 8px 15px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 8px 32px var(--shadow-color);
            transition: all 0.3s ease;
            z-index: 20;
        }
        .search-wrapper:focus-within { border-color: var(--accent-color); box-shadow: 0 0 20px var(--accent-color); }
        .engine-select {
            background: transparent; border: none; color: var(--text-color);
            font-size: 1rem; padding: 10px; cursor: pointer; outline: none;
            font-weight: 600; appearance: none;
        }
        .engine-select option { background: var(--bg-color); color: var(--text-color); }
        body[data-theme="glass"] .engine-select option { background: #ffffff; color: #1a202c; }
        .search-input {
            flex: 1; background: transparent; border: none; color: var(--text-color);
            font-size: 1.1rem; padding: 10px; outline: none;
        }
        .search-input::placeholder { color: var(--text-color); opacity: 0.5; }
        .search-btn {
            background: transparent;
            border: 1.5px solid var(--text-color);
            color: var(--text-color);
            border-radius: 50%; width: 40px; height: 40px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer; transition: all 0.2s;
        }
        .search-btn:hover { background: var(--accent-color); border-color: var(--accent-color); color: #fff; transform: scale(1.05); }
        body[data-theme="glass"] .search-btn {
            background: transparent;
            border: 1.5px solid rgba(255, 255, 255, 0.9);
            color: #1a202c;
            box-shadow: 0 2px 8px rgba(0,0,0,0.1);
        }
        body[data-theme="glass"] .search-btn:hover { background: rgba(255, 255, 255, 0.2); }

        .inline-bookmarks {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            transition: all 0.4s ease;
        }
        body.productivity-mode .inline-bookmarks {
            max-height: 2000px;
            opacity: 1;
            margin-top: 24px;
        }
        .inline-bookmarks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(80px, 1fr));
            gap: 12px;
        }
        .inline-bookmark-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 12px 8px;
            background: var(--panel-bg);
            border: var(--glass-border);
            border-radius: 16px;
            cursor: pointer;
            text-decoration: none;
            color: var(--text-color);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 4px 15px var(--shadow-color);
            transition: all 0.2s;
            position: relative;
        }
        .inline-bookmark-item:hover {
            transform: translateY(-3px);
            border-color: var(--accent-color);
            box-shadow: 0 8px 20px var(--shadow-color);
        }
        .inline-bookmark-icon {
            width: 30px; height: 30px; margin-bottom: 6px;
            border-radius: 8px; object-fit: cover;
        }
        .inline-bookmark-title {
            font-size: 0.72rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            width: 100%;
            font-weight: 600;
        }
        .inline-bookmarks-empty {
            grid-column: 1 / -1;
            text-align: center;
            padding: 20px;
            opacity: 0.5;
            font-size: 0.9rem;
        }

        .scratchpad {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            transition: all 0.4s ease;
        }
        body.productivity-mode .scratchpad {
            max-height: 1000px;
            opacity: 1;
            margin-top: 20px;
        }
        .scratchpad-card {
            background: var(--panel-bg);
            border: var(--glass-border);
            border-radius: 20px;
            padding: 16px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 8px 32px var(--shadow-color);
        }
        .scratchpad-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            font-size: 0.85rem;
            font-weight: 600;
            opacity: 0.8;
        }
        .scratchpad-status {
            font-size: 0.7rem;
            font-weight: 500;
            opacity: 0.5;
            transition: opacity 0.3s;
        }
        .scratchpad-status.saving {
            opacity: 1;
            color: var(--accent-color);
        }
        .scratchpad-textarea {
            width: 100%;
            min-height: 100px;
            max-height: 220px;
            background: var(--input-bg);
            border: 1px solid transparent;
            border-radius: 12px;
            padding: 12px;
            color: var(--text-color);
            font-size: 0.95rem;
            font-family: inherit;
            line-height: 1.5;
            resize: vertical;
            outline: none;
            transition: border-color 0.2s;
        }
        .scratchpad-textarea:focus { border-color: var(--accent-color); }
        .scratchpad-textarea::placeholder { color: var(--text-color); opacity: 0.4; }
        .scratchpad-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 8px;
            font-size: 0.7rem;
            opacity: 0.5;
        }
        .scratchpad-clear {
            background: transparent;
            border: none;
            color: var(--text-color);
            cursor: pointer;
            font-size: 0.7rem;
            opacity: 0.7;
            padding: 2px 6px;
            border-radius: 4px;
        }
        .scratchpad-clear:hover {
            opacity: 1;
            background: rgba(255, 0, 0, 0.1);
            color: var(--accent-color);
        }

        .radio-player {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            opacity: 0;
            margin-top: 0;
            transition: all 0.4s ease;
        }
        body.radio-mode .radio-player {
            max-height: 3000px;
            opacity: 1;
            margin-top: 30px;
        }
        .radio-player-card {
            background: var(--panel-bg);
            border: var(--glass-border);
            border-radius: 24px;
            padding: 24px;
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            box-shadow: 0 8px 32px var(--shadow-color);
        }
        .radio-station-display {
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 20px;
        }
        .radio-station-icon {
            width: 88px; height: 88px;
            border-radius: 20px;
            background: var(--input-bg);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 12px;
            box-shadow: 0 4px 15px var(--shadow-color);
            overflow: hidden;
            pointer-events: none;
        }
        .radio-station-icon img {
            width: 100%; height: 100%;
            object-fit: cover;
            display: block;
        }
        .radio-station-icon .fallback-emoji {
            font-size: 2.5rem;
        }
        .radio-station-name {
            font-size: 1.2rem;
            font-weight: 700;
            text-align: center;
            margin-bottom: 4px;
        }
        .radio-live-indicator {
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            opacity: 0;
            transition: opacity 0.3s;
        }
        .radio-live-indicator.playing {
            opacity: 1;
            color: var(--accent-color);
        }
        .radio-live-dot {
            width: 8px; height: 8px;
            border-radius: 50%;
            background: var(--accent-color);
            animation: pulse 1.5s ease-in-out infinite;
        }
        @keyframes pulse {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.2); }
        }
        .radio-controls {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 20px;
            margin-bottom: 18px;
        }
        .radio-btn {
            background: var(--input-bg);
            border: var(--glass-border);
            border-radius: 50%;
            width: 50px; height: 50px;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
            color: var(--text-color);
            font-size: 1.3rem;
            transition: all 0.2s;
        }
        .radio-btn:hover {
            background: var(--accent-color);
            color: #fff;
            border-color: var(--accent-color);
            transform: scale(1.1);
        }
        .radio-btn:active {
            transform: scale(0.95);
        }
        .radio-btn-play {
            width: 60px; height: 60px;
            font-size: 1.5rem;
        }
        .radio-volume-control {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            margin-bottom: 24px;
        }
        .radio-volume-icon {
            font-size: 1.2rem;
            opacity: 0.7;
        }
        .radio-volume-slider {
            flex: 1;
            height: 6px;
            border-radius: 3px;
            background: var(--input-bg);
            outline: none;
            -webkit-appearance: none;
            appearance: none;
        }
        .radio-volume-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .radio-volume-slider::-moz-range-thumb {
            width: 18px; height: 18px;
            border-radius: 50%;
            background: var(--accent-color);
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px var(--shadow-color);
        }
        .radio-stations-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
            padding: 0 4px;
        }
        .radio-stations-title {
            font-size: 0.9rem;
            font-weight: 700;
            opacity: 0.8;
            letter-spacing: 0.3px;
        }
        .radio-stations-count {
            font-size: 0.75rem;
            opacity: 0.5;
        }
        .radio-stations-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 10px;
        }
        .radio-station-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 14px 10px;
            background: var(--input-bg);
            border: 1.5px solid transparent;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.2s;
            text-align: center;
            position: relative;
        }
        .radio-station-card:hover {
            transform: translateY(-2px);
            border-color: var(--accent-color);
            box-shadow: 0 6px 18px var(--shadow-color);
        }
        .radio-station-card.active {
            background: var(--accent-color);
            border-color: var(--accent-color);
            color: #fff;
            box-shadow: 0 6px 18px var(--shadow-color);
        }
        .radio-station-card.active .radio-station-card-name {
            color: #fff;
        }
        .radio-station-card-icon {
            width: 48px; height: 48px;
            border-radius: 12px;
            background: var(--panel-bg);
            display: flex; align-items: center; justify-content: center;
            margin-bottom: 8px;
            overflow: hidden;
            flex-shrink: 0;
        }
        .radio-station-card.active .radio-station-card-icon {
            background: rgba(255,255,255,0.2);
        }
        .radio-station-card-icon img {
            width: 100%; height: 100%;
            object-fit: cover;
